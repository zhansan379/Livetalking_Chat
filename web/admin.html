<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <!-- 本地化依赖（web/lib）：完全离线可用 -->
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* ── 亮色主题（默认） ── */
            --bg: #eef2f8;
            --bg-2: #dde7f4;
            --glow-a: rgba(13, 148, 136, .10);
            --glow-b: rgba(2, 132, 199, .07);
            --gridline: rgba(15, 23, 42, .04);
            --border: rgba(15, 23, 42, .12);
            --text: #17233a;
            --muted: #5b6b81;
            --accent: #0d9488;      /* 品牌青绿 */
            --accent-2: #d97706;    /* 琥珀 */
            --danger: #e11d48;
            --ok: #059669;
            --info: #0284c7;
            --navbar-bg: rgba(255, 255, 255, .7);
            --brand-fg: #111b2c;
            --card-a: #ffffff;
            --card-b: #f1f6fd;
            --card-solid: #f6f9fe;
            --code-bg: #eef4fb;
            --code-fg: #26364c;
            --shadow: 0 14px 40px -22px rgba(23, 51, 94, .28);
            --skeleton-a: rgba(15, 23, 42, .07);
            --skeleton-b: rgba(15, 23, 42, .13);
            --empty-ico: #c5d1e1;
            --ghost-fg: #33415a;
            --ghost-border: rgba(15, 23, 42, .18);
            --tab-fg: #526075;
            --tab-bg: rgba(15, 23, 42, .05);
            --tab-hover-bg: rgba(15, 23, 42, .09);
            --input-bg: #ffffff;
            --input-ph: #9aa9bb;
            --input-focus: rgba(13, 148, 136, .18);
            --chip-muted-bg: #e8eef7;
            --chip-muted-fg: #3f4f68;
            --chip-info-bg: rgba(2, 132, 199, .12);
            --chip-info-fg: #075985;
            --badge-pend-bg: rgba(217, 119, 6, .14);
            --badge-pend-fg: #b45309;
            --badge-run-bg: rgba(2, 132, 199, .13);
            --badge-run-fg: #0369a1;
            --badge-ok-bg: rgba(5, 150, 105, .13);
            --badge-ok-fg: #047857;
            --badge-fail-bg: rgba(225, 29, 72, .12);
            --badge-fail-fg: #be123c;
            --badge-silent-bg: rgba(100, 116, 139, .14);
            --badge-silent-fg: #526075;
            --badge-rec-bg: rgba(225, 29, 72, .14);
            --badge-rec-fg: #be123c;
            --btn-danger-border: rgba(225, 29, 72, .35);
            --row-hover: rgba(13, 148, 136, .06);
            --progress-track: rgba(2, 132, 199, .14);
            --pulse-c: rgba(225, 29, 72, .40);
        }
        :root[data-theme="dark"] {
            /* ── 暗色主题 ── */
            --bg: #070b16;
            --bg-2: #0b1220;
            --glow-a: rgba(45, 212, 191, .10);
            --glow-b: rgba(56, 189, 248, .08);
            --gridline: rgba(148, 163, 184, .05);
            --border: rgba(148, 163, 184, .14);
            --text: #e6edf7;
            --muted: #8ba0b6;
            --accent: #2dd4bf;      /* 电光青绿 */
            --accent-2: #fbbf24;    /* 琥珀 */
            --danger: #f43f5e;
            --ok: #34d399;
            --info: #38bdf8;
            --navbar-bg: rgba(7, 11, 22, .6);
            --brand-fg: #ffffff;
            --card-a: rgba(23, 34, 58, .55);
            --card-b: rgba(13, 20, 38, .6);
            --card-solid: #101a2e;
            --code-bg: rgba(9, 15, 28, .6);
            --code-fg: #bcd2e8;
            --shadow: 0 14px 40px -18px rgba(0, 0, 0, .7);
            --skeleton-a: rgba(148, 163, 184, .08);
            --skeleton-b: rgba(148, 163, 184, .16);
            --empty-ico: #33415a;
            --ghost-fg: #cfe3f5;
            --ghost-border: rgba(148, 163, 184, .35);
            --tab-fg: #cfe3f5;
            --tab-bg: rgba(255, 255, 255, .06);
            --tab-hover-bg: rgba(255, 255, 255, .12);
            --input-bg: #0e1830;
            --input-ph: #4c5c75;
            --input-focus: rgba(45, 212, 191, .15);
            --chip-muted-bg: #243047;
            --chip-muted-fg: #cfe3f5;
            --chip-info-bg: rgba(56, 189, 248, .16);
            --chip-info-fg: #bfe6ff;
            --badge-pend-bg: rgba(251, 191, 36, .14);
            --badge-pend-fg: #fcd34d;
            --badge-run-bg: rgba(56, 189, 248, .14);
            --badge-run-fg: #bae6fd;
            --badge-ok-bg: rgba(52, 211, 153, .14);
            --badge-ok-fg: #5eead4;
            --badge-fail-bg: rgba(244, 63, 94, .14);
            --badge-fail-fg: #fda4af;
            --badge-silent-bg: rgba(148, 163, 184, .12);
            --badge-silent-fg: #9fb0c2;
            --badge-rec-bg: rgba(244, 63, 94, .15);
            --badge-rec-fg: #fda4af;
            --btn-danger-border: rgba(244, 63, 94, .4);
            --row-hover: rgba(45, 212, 191, .05);
            --progress-track: rgba(148, 163, 184, .12);
            --pulse-c: rgba(244, 63, 94, .40);
            --accent-ink: #062b26;
        }
        :root {
            /* 亮色主题下文字着色统一走 --accent-ink（=白） */
            --accent-ink: #ffffff;
            --mono: "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", menlo, monospace;
            --sans: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
            --r: 14px;
        }
        * { box-sizing: border-box; }

        body {
            font-family: var(--sans);
            color: var(--text);
            background:
                radial-gradient(900px 480px at 78% -6%, var(--glow-a), transparent 60%),
                radial-gradient(820px 420px at 6% 0%, var(--glow-b), transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            min-height: 100vh; padding: 0; margin: 0;
        }
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(var(--gridline) 1px, transparent 1px),
                linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 72%);
            -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 72%);
        }
        .glass-card { position: relative; }
        .container { position: relative; z-index: 1; max-width: 1200px; padding-top: 20px; padding-bottom: 40px; }

        /* ── 顶部导航 ── */
        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .navbar-brand { font-family: var(--mono); font-weight: 700; color: var(--brand-fg); letter-spacing: .4px; }
        .navbar-brand svg { color: var(--accent); }
        .nav-tabs { border-bottom: none; margin-top: 14px; }
        .navbar .nav-tabs { margin-left: auto; margin-right: auto; padding: 0 16px; }
        .nav-tabs .nav-link {
            color: var(--tab-fg); background: var(--tab-bg);
            border: 1px solid transparent; border-radius: 999px;
            padding: 8px 18px; margin-right: 8px; font-weight: 500; font-size: .9rem;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background .2s ease, transform .2s ease;
        }
        .nav-tabs .nav-link:hover { background: var(--tab-hover-bg); }
        .nav-tabs .nav-link.active { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
        .btn-outline-light {
            color: var(--ghost-fg); border-color: var(--ghost-border);
            display: inline-flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .btn-outline-light svg { width: 15px; height: 15px; flex: none; }
        .btn-outline-light:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

        /* ── 玻璃卡片 ── */
        .glass-card {
            background: linear-gradient(180deg, var(--card-a), var(--card-b));
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--shadow);
        }
        .glass-card::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
        }
        .card-header {
            background: transparent; border-bottom: 1px solid var(--border);
            padding: 18px 22px; font-weight: 700; font-size: 1.02rem;
            display: flex; align-items: center; font-family: var(--mono); letter-spacing: .2px;
        }
        .card-header svg { color: var(--accent); margin-right: 9px; flex-shrink: 0; }
        .card-body { padding: 22px; position: relative; }

        .refresh-spinner { font-size: .8rem; color: var(--muted); margin-left: auto; font-weight: 400; }
        .refresh-spinner svg { vertical-align: -3px; margin-right: 4px; }
        .spin { animation: rotation 1s linear infinite; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } }

        /* ── 生成任务 ── */
        .btn-submit {
            background: linear-gradient(135deg, var(--accent), var(--info));
            border: none; color: var(--accent-ink);
            padding: 12px; font-weight: 700; border-radius: 10px;
            transition: transform .2s, box-shadow .2s; width: 100%;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: var(--mono);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(2, 132, 199, .35);
            color: var(--accent-ink);
        }
        .param-group {
            background: var(--input-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 10px; margin-top: 12px;
        }
        .form-label { color: var(--muted); font-size: .78rem; font-family: var(--mono); letter-spacing: .3px; }
        .form-control, .form-select {
            background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
            font-family: var(--mono); font-size: .9rem;
        }
        .form-control::placeholder { color: var(--input-ph); }
        .form-control:focus, .form-select:focus {
            background: var(--input-bg); color: var(--text); border-color: var(--accent);
            box-shadow: 0 0 0 .2rem var(--input-focus);
        }
        .form-select option { background: var(--input-bg); color: var(--text); }
        a.link-primary, .text-decoration-none.link-primary { color: var(--accent); }

        .task-item { border-bottom: 1px solid var(--border); padding: 14px 0; position: relative; }
        .task-item:last-child { border-bottom: none; }

        .badge-status {
            font-size: .74rem; padding: 4px 11px; border-radius: 20px; font-weight: 700;
            font-family: var(--mono); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 5px;
        }
        .badge-status svg { width: 13px; height: 13px; }
        .status-pending   { background: var(--badge-pend-bg); color: var(--badge-pend-fg); border-color: var(--badge-pend-fg); }
        .status-running   { background: var(--badge-run-bg); color: var(--badge-run-fg); border-color: var(--badge-run-fg); }
        .status-completed { background: var(--badge-ok-bg); color: var(--badge-ok-fg); border-color: var(--badge-ok-fg); }
        .status-failed    { background: var(--badge-fail-bg); color: var(--badge-fail-fg); border-color: var(--badge-fail-fg); }

        .task-list-scroll { max-height: 560px; overflow-y: auto; padding-right: 4px; }

        /* ── 控制台 ── */
        .config-table {
            --bs-table-bg: transparent; --bs-table-color: var(--text);
            background-color: transparent;
        }
        .config-table th {
            color: var(--muted); font-weight: 600; text-transform: uppercase;
            font-size: .78rem; letter-spacing: .5px; border-bottom: 2px solid var(--border); background: transparent;
        }
        .config-table td {
            font-weight: 500; color: var(--text); vertical-align: middle;
            word-break: break-all; border-bottom: 1px solid var(--border); background: transparent;
        }
        .config-table tr:hover td { background: var(--row-hover); }

        .session-card {
            background: linear-gradient(180deg, var(--card-a), var(--card-b));
            border: 1px solid var(--border); border-left: 3px solid var(--accent);
            border-radius: 12px; padding: 18px; margin-bottom: 16px; position: relative;
        }
        .session-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
        }
        .session-id { font-size: 1.02rem; font-weight: 700; color: var(--accent); font-family: var(--mono); }
        .session-detail-item { margin-bottom: 6px; font-size: .9rem; }
        .session-detail-item strong { color: var(--muted); font-weight: 500; margin-right: 6px; }

        .badge-speaking  { background: var(--badge-ok-bg); color: var(--badge-ok-fg); }
        .badge-silent    { background: var(--badge-silent-bg); color: var(--badge-silent-fg); }
        .badge-recording { background: var(--badge-rec-bg); color: var(--badge-rec-fg); animation: pulse 2s infinite; }
        .badge-online, .badge-offline { display: inline-flex; align-items: center; gap: 4px; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--pulse-c); }
            70% { box-shadow: 0 0 0 6px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        .empty-state { text-align: center; padding: 36px 16px; color: var(--muted); }
        .empty-state svg { width: 38px; height: 38px; color: var(--empty-ico); margin-bottom: 12px; }

        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite;
            border-radius: 4px; height: 20px;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        pre.customopt {
            max-height: 130px; overflow-y: auto; font-size: .72rem;
            background: var(--code-bg); border: 1px solid var(--border);
            color: var(--code-fg); border-radius: 8px; padding: 10px; font-family: var(--mono);
        }

        .footer-hint { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 26px; font-family: var(--mono); }

        /* ── Bootstrap 覆盖 ── */
        .progress { background: var(--progress-track); }
        .progress-bar { background: var(--accent); }
        .alert-danger { background: var(--badge-fail-bg); color: var(--badge-fail-fg); border-color: var(--btn-danger-border); }
        .btn-outline-danger { color: var(--badge-fail-fg); border-color: var(--btn-danger-border); display: inline-flex; align-items: center; gap: 5px; }
        .btn-outline-danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-outline-danger svg { width: 14px; height: 14px; }
        a, .text-primary { color: var(--accent); }
        .text-success { color: var(--ok) !important; }
        .text-danger { color: var(--danger) !important; }
        .text-muted, .text-secondary { color: var(--muted) !important; }
        .badge.bg-primary { background: var(--accent) !important; color: var(--accent-ink); }
        .badge.bg-secondary { background: var(--chip-muted-bg) !important; color: var(--chip-muted-fg); }
        .badge.bg-info { background: var(--chip-info-bg) !important; color: var(--chip-info-fg); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid px-4">

<div class="container">
    <div class="tab-content" id="mainTabContent">

        <!-- ============ Tab 1：生成任务 ============ -->
        <div class="tab-pane fade show active" id="genPane" role="tabpanel">
            <div class="row g-4">
                <!-- 创建任务 -->
                <div class="col-lg-5">
                    <div class="glass-card">
                        <div class="card-header">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                            创建新生成任务
                        </div>
                        <div class="card-body">
                            <form id="taskForm" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label class="form-label">算法模型</label>
                                    <select class="form-select" name="model" id="modelSelect" required>
                                        <option value="wav2lip">Wav2Lip</option>
                                        <option value="musetalk">MuseTalk</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Avatar ID</label>
                                    <input type="text" class="form-control" name="avatar_id" placeholder="如: wav2lip256_test" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">视频文件</label>
                                    <input type="file" class="form-control" name="video_file" accept="video/*" required>
                                </div>

                                <div class="mb-3">
                                    <a class="text-decoration-none link-primary" data-bs-toggle="collapse" href="#advancedParams" role="button">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                        高级参数 (可选)
                                    </a>
                                    <div class="collapse mt-2" id="advancedParams">
                                        <div class="param-group">
                                            <div class="row">
                                                <div class="col-6 mb-2">
                                                    <label class="form-label small">图像大小</label>
                                                    <input type="number" class="form-control form-control-sm" name="img_size" value="256">
                                                </div>
                                                <div class="col-6 mb-2">
                                                    <label class="form-label small">BBox Shift (musetalk)</label>
                                                    <input type="number" class="form-control form-control-sm" name="bbox_shift" value="0">
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-6 mb-2">
                                                    <label class="form-label small">Pads (上下左右)</label>
                                                    <input type="text" class="form-control form-control-sm" name="pads" value="0 10 0 0" placeholder="0 10 0 0">
                                                </div>
                                                <div class="col-6 mb-2">
                                                    <label class="form-label small">人脸检测批大小</label>
                                                    <input type="number" class="form-control form-control-sm" name="face_det_batch_size" value="4">
                                                </div>

                                <button type="submit" class="btn btn-submit mt-1" id="submitBtn">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/></svg>
                                    提交生成任务
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 任务列表 -->
                <div class="col-lg-7">
                    <div class="glass-card">
                        <div class="card-header">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 8h1"/><path d="M14 8h3"/><path d="M7 12h5"/><path d="M7 16h8"/></svg>
                            任务列表
                            <span class="refresh-spinner" id="refreshInfo">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
                                自动更新中...
                            </span>
                        </div>
                        <div class="card-body">
                            <div class="task-list-scroll" id="taskList">
                                <div class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div>正在加载任务列表...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ Tab 2：控制台 ============ -->
        <div class="tab-pane fade" id="consolePane" role="tabpanel">
            <div class="row g-4">
                <!-- 全局配置 -->
                <div class="col-lg-5">
                    <div class="glass-card h-100">
                        <div class="card-header">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            全局配置
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-borderless config-table" id="configTable">
                                    <tbody>
                                        <tr><th>加载中...</th><td><div class="skeleton"></div></td></tr>
                                        <tr><th>加载中...</th><td><div class="skeleton"></div></td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 活跃会话 -->
                <div class="col-lg-7">
                    <div class="glass-card">
                        <div class="card-header">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-success" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            活跃会话
                            <span class="badge bg-primary ms-2 rounded-pill" id="sessionCount">0</span>
                        </div>
                        <div class="card-body" id="sessionsContainer">
                            <div class="session-card glass-card">
                                <div class="skeleton mb-3" style="width: 40%; height: 26px;"></div>
                                <div class="skeleton mb-2" style="width: 80%;"></div>
                                <div class="skeleton" style="width: 60%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="footer-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>接口：/api/avatar/*（生成任务）、/api/admin/*（控制台）
    </div>
</div>

<script src="lib/bootstrap.bundle.min.js"></script>
<script src="lib/jquery-2.1.1.min.js"></script>
<script>
/* ==========================================================
 *  内联 SVG 图标库（Lucide 风格，禁止 Emoji）
 * ========================================================== */
const IC = {
    clock:  '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    loader: '<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>',
    check:  '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    alert:  '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>',
    trash:  '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
    inbox:  '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    dot:    '<circle cx="12" cy="12" r="4"/>',
    mic:    '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
    micOff: '<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>',
    record: '<circle cx="12" cy="12" r="8" fill="currentColor" stroke="none"/>',
    people: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    checkCheck: '<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
    sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon:   '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
};
function svg(paths, extra) {
    return '<svg class="' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}
function svgFilled(paths, extra) {
    return '<svg class="' + (extra || '') + '" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">' + paths + '</svg>';
}

/* ==========================================================
 *  主题切换（默认亮色，localStorage 记住选择）
 * ========================================================== */
function applyTheme() {
    const saved = localStorage.getItem('lt-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme'); // 默认亮色
    refreshThemeIco();
}
function refreshThemeIco() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('#themeToggle').html(svg(dark ? IC.sun : IC.moon, 'themeIco') + '<span class="d-none d-sm-inline"> ' + (dark ? '亮色' : '暗色') + '</span>');
}
function toggleTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('lt-theme', 'light'); }
    else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('lt-theme', 'dark'); }
    refreshThemeIco();
}

/* ==========================================================
 *  生成任务 Tab
 * ========================================================== */
const $form = $('#taskForm'), $submit = $('#submitBtn'), $taskList = $('#taskList');

$form.on('submit', async (e) => {
    e.preventDefault();
    $submit.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>正在上传并创建任务...');
    try {
        const res = await fetch('/api/avatar/task', { method: 'POST', body: new FormData($form[0]) });
        const r = await res.json();
        if (r.code === 0) {
            toast('任务提交成功! Task ID: ' + r.data.task_id, true);
            $form[0].reset();
            refreshTasks();
        } else {
            toast('提交失败: ' + r.msg, false);
        }
    } catch (err) {
        toast('提交发生网络错误', false);
    } finally {
        $submit.prop('disabled', false).html(svg('<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/>') + '提交生成任务');
    }
});

async function refreshTasks() {
    try {
        const res = await fetch('/api/avatar/tasks');
        const r = await res.json();
        if (r.code === 0) renderTasks(r.data.tasks);
    } catch (err) { /* 忽略瞬时错误 */ }
}

const STATUS_LABEL = {
    pending: '排队中', running: '生成中', completed: '已完成', failed: '失败'
};
const STATUS_ICO = {
    pending: 'clock', running: 'loader', completed: 'check', failed: 'alert'
};

function renderTasks(tasks) {
    if (!tasks || !tasks.length) {
        $taskList.html('<div class="empty-state">' + svg(IC.inbox) + '<h5>暂无任务</h5><p>提交上方表单即可开始生成数字人。</p></div>');
        return;
    }
    let html = '';
    tasks.forEach(t => {
        const date = t.start_time ? new Date(t.start_time * 1000).toLocaleString() : '-';
        const sc = 'status-' + t.status;
        const label = STATUS_LABEL[t.status] || t.status.toUpperCase();
        const ico = STATUS_ICO[t.status] || 'dot';
        html += `
        <div class="task-item">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <div class="fw-bold small text-primary" style="font-family:var(--mono)"># ${t.task_id}</div>
                    <div class="small text-muted mt-1" style="color:var(--muted)">
                        <span class="badge bg-secondary me-1">${t.model_type}</span>
                        <span class="me-1">Avatar: <b style="color:var(--text)">${t.avatar_id}</b></span>
                        ${t.notify_url ? '<span class="badge bg-info">通知</span>' : ''}
                    </div>
                </div>
                <div class="text-end">
                    <span class="badge-status ${sc}">${svg(IC[ico] || IC.dot)}${label}</span>
                    <div class="small text-muted mt-1" style="font-size:0.7rem;color:var(--muted)">${date}</div>
                </div>
            </div>
            ${t.status !== 'completed' && t.status !== 'failed' ? `
            <div class="progress" style="height:8px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                     style="width:${t.progress}%" aria-valuenow="${t.progress}" aria-valuemin="0" aria-valuemax="100">${t.progress}%</div>
            </div>` : ''}
            ${t.error_msg ? `<div class="alert alert-danger p-2 mt-2 small mb-0">${t.error_msg}</div>` : ''}
            ${t.status === 'pending' ? `
            <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-sm btn-outline-danger" onclick="deleteTask('${t.task_id}')">
                    ${svg(IC.trash)} 取消任务
                </button>
            </div>` : ''}
        </div>`;
    });
    $taskList.html(html);
}

async function deleteTask(taskId) {
    if (!confirm('确定要取消此 Pending 任务吗?')) return;
    try {
        const res = await fetch('/api/avatar/task/' + taskId, { method: 'DELETE' });
        const r = await res.json();
        r.code === 0 ? toast('已取消任务', true) : toast(r.msg, false);
        refreshTasks();
    } catch (err) { toast('删除请求失败', false); }
}

/* ==========================================================
 *  控制台 Tab
 * ========================================================== */
const configLabels = {
    'model': '数字人模型',
    'avatar_id': '默认角色 ID',
    'tts': 'TTS 引擎',
    'REF_FILE': '语音参考',
    'transport': '流媒体协议',
    'listenport': '监听端口',
    'batch_size': '推理批次 (Batch)',
    'fps': '视频帧率 (FPS)',
    'push_url': '推流地址'
};

async function fetchConfig() {
    try {
        const res = await fetch('/api/admin/config');
        const r = await res.json();
        if (r.code === 0) renderConfig(r.data.config);
    } catch (err) { /* 忽略 */ }
}

async function fetchSessions() {
    try {
        const res = await fetch('/api/admin/sessions');
        const r = await res.json();
        if (r.code === 0) {
            $('#sessionCount').text(r.data.sessions.length);
            renderSessions(r.data.sessions);
        }
    } catch (err) { /* 忽略 */ }
}

function renderConfig(config) {
    const $tbody = $('#configTable tbody');
    $tbody.empty();
    for (const [k, label] of Object.entries(configLabels)) {
        if (config[k] === undefined) continue;
        const val = config[k] === '' || config[k] === null
            ? '<span class="text-muted">未设置</span>'
            : (typeof config[k] === 'object' ? JSON.stringify(config[k]) : config[k]);
        $tbody.append(`<tr><th>${label}</th><td style="font-family:var(--mono)">${val}</td></tr>`);
    }
    if (!$tbody.children().length) {
        $tbody.append('<tr><td colspan="2" class="text-muted">暂无配置项</td></tr>');
    }
}

function renderSessions(sessions) {
    const $c = $('#sessionsContainer');
    $c.empty();
    if (!sessions.length) {
        $c.append(`<div class="empty-state">${svg(IC.people)}<h5>暂无活跃的会话连接</h5><p>当用户在前端发起连接时，此列表将自动更新。</p></div>`);
        return;
    }
    sessions.forEach(s => {
        const speak = s.speaking
            ? `<span class="badge badge-speaking">${svg(IC.mic, 'align')} 说话中</span>`
            : `<span class="badge badge-silent">${svg(IC.micOff)} 静音</span>`;
        const rec = s.recording
            ? `<span class="badge badge-recording ms-2">${svgFilled(IC.record)} 录制中</span>` : '';
        const custom = (s.customopt && s.customopt.length)
            ? `<pre class="customopt">${JSON.stringify(s.customopt, null, 2)}</pre>`
            : '<span class="text-muted">无</span>';
        $c.append(`
        <div class="session-card glass-card">
            <div class="session-header">
                <div>
                    <span class="session-id">SID: ${s.sessionid}</span>
                    <div class="mt-1 text-muted" style="font-size:0.82rem">传输层: ${s.transport || '默认'}</div>
                </div>
                <div>${speak}${rec}</div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="session-detail-item"><strong>角色ID:</strong> ${s.avatar_id}</div>
                    <div class="session-detail-item"><strong>核心模型:</strong> ${s.model}</div>
                </div>
                <div class="col-md-6">
                    <div class="session-detail-item"><strong>语音参考:</strong> ${s.REF_FILE}</div>
                    <div class="session-detail-item mt-2"><strong>动作编排:</strong></div>
                    <div class="mt-1">${custom}</div>
                </div>
            </div>
        </div>`);
    });
}

function refreshConsole() {
    Promise.all([fetchConfig(), fetchSessions()]);
}

/* ==========================================================
 *  轻量 Toast 提示
 * ========================================================== */
function toast(msg, isOk) {
    const $t = $('<div style="position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:2000;' +
        'background:' + (isOk ? '#0b6e5a' : '#7f1d2e') + ';color:#fff;padding:10px 20px;border-radius:999px;' +
        'border:1px solid ' + (isOk ? 'rgba(45,212,191,.5)' : 'rgba(244,63,94,.5)') + ';' +
        'box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:0.9rem;' +
        'display:inline-flex;align-items:center;gap:7px;">' + svg(isOk? 'checkCheck':'alert') + msg + '</div>').appendTo('body');
    setTimeout(() => $t.fadeOut(300, () => $t.remove()), 2600);
}

/* ==========================================================
 *  初始化与定时刷新
 * ========================================================== */
$(function () {
    applyTheme();
    refreshTasks();
    refreshConsole();

    // 生成任务：3s 轮询；控制台：5s 轮询（会话更新）
    setInterval(refreshTasks, 3000);
    setInterval(refreshSessionsOnly, 5000);
});

function refreshSessionsOnly() { fetchSessions(); }
</script>
