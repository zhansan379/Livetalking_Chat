            --navbar-bg: rgba(255, 255, 255, .7);
            --brand-fg: #111b2c;

            --card-solid: #f6f9fe;

            --pill-bg: rgba(2, 132, 199, .10);
            --chip-muted-bg: #e8eef7;
            --chip-muted-fg: #3f4f68;
            --chip-info-bg: rgba(2, 132, 199, .12);
            --chip-info-fg: #075985;
            --badge-ok-bg: rgba(5, 150, 105, .13);
            --badge-ok-fg: #047857;

            --badge-fail-fg: #be123c;
            --badge-warn-bg: rgba(217, 119, 6, .14);
            --badge-warn-fg: #b45309;
            --badge-run-bg: rgba(2, 132, 199, .13);
            --badge-run-fg: #0369a1;
            --badge-silent-bg: rgba(100, 116, 139, .14);
            --badge-silent-fg: #526075;
            --badge-rec-bg: rgba(225, 29, 72, .14);

            --ok: #34d399;
            --accent-2: #fbbf24;

            --brand-fg: #ffffff;
            --card-a: rgba(23, 34, 58, .6);
            --card-b: rgba(13, 20, 38, .66);
            --card-solid: #101a2e;
            --code-bg: rgba(9, 15, 28, .6);
            --code-fg: #bcd2e8;
            --shadow: 0 14px 40px -18px rgba(0, 0, 0, .7);
            --row-hover: rgba(45, 212, 191, .05);
            --empty-ico: #33415a;
            --skeleton-a: rgba(148, 163, 184, .08);
            --skeleton-b: rgba(148, 163, 184, .16);
            --ghost-fg: #cfe3f5;
            --ghost-border: rgba(148, 163, 184, .35);
            --navlink-fg: #cfe3f5;
            --navlink-hover-bg: rgba(255, 255, 255, .12);
            --pill-bg: rgba(255, 255, 255, .06);
            --chip-muted-bg: #243047;
            --chip-muted-fg: #cfe3f5;
            --chip-info-bg: rgba(56, 189, 248, .16);
            --chip-info-fg: #bfe6ff;
            --badge-ok-bg: rgba(52, 211, 153, .14);
            --badge-ok-fg: #5eead4;
            --badge-fail-bg: rgba(244, 63, 94, .14);
            --badge-fail-fg: #fda4af;
            --badge-warn-bg: rgba(251, 191, 36, .14);
            --badge-warn-fg: #fcd34d;
            --badge-run-bg: rgba(56, 189, 248, .14);
            --badge-run-fg: #bae6fd;
            --badge-silent-bg: rgba(148, 163, 184, .12);
            --badge-silent-fg: #9fb0c2;
            --badge-rec-bg: rgba(244, 63, 94, .15);
            --badge-rec-fg: #fda4af;
            --progress-track: rgba(148, 163, 184, .12);
            --disc-fg: rgba(148, 163, 184, .6);
            --chart-axis: #7f93ab;
            --chart-split: rgba(148, 163, 184, .10);
            --chart-text: #e6edf7;
            --chart-tipbg: rgba(11, 18, 32, .94);
            --chart-tipborder: rgba(148, 163, 184, .25);

        * { box-sizing: border-box; }

        body {
            font-family: var(--sans);
            color: var(--text);
            background:
                radial-gradient(900px 480px at 78% -6%, var(--glow-a), transparent 60%),
                radial-gradient(820px 420px at 6% 0%, var(--glow-b), transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            margin: 0;
            --sans: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
            --mono: "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", menlo, monospace;
        }
        /* 底层网格纹理，营造“运维终端”质感 */
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(var(--gridline) 1px, transparent 1px),
                linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 72%);
            -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 72%);
        }
        .container { position: relative; z-index: 1; max-width: 1240px; padding-top: 22px; padding-bottom: 44px; }

        /* ── 顶部导航 ── */
        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .navbar-brand { font-family: var(--mono); font-weight: 700; color: var(--brand-fg); letter-spacing: .4px; }
        .navbar-brand svg { color: var(--accent); }
        .btn-outline-light {
            color: var(--ghost-fg); border-color: var(--ghost-border);
            display: inline-flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .btn-outline-light svg { width: 15px; height: 15px; flex: none; }
        /* 自动刷新切换后按钮从 btn-outline-light 变 btn-primary，图标尺寸不随之丢失 */
        #autoToggle svg { width: 15px; height: 15px; flex: none; }
        .btn-outline-light:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

        /* ── 玻璃卡片 ── */
        .glass-card {
            background: linear-gradient(180deg, var(--card-a), var(--card-b));
            border: 1px solid var(--border);
            border-radius: var(--r, 14px);
            box-shadow: var(--shadow);
            position: relative;
        }
        .glass-card::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
        }
        .card-header {
            background: transparent; border-bottom: 1px solid var(--border);
            padding: 15px 20px; font-weight: 700; font-size: .92rem;
            display: flex; align-items: center; font-family: var(--mono); letter-spacing: .2px;
        }
        .card-header svg { color: var(--accent); margin-right: 9px; flex-shrink: 0; }
        .card-body { padding: 18px 20px; }

        /* ── 指标卡片 ── */
        .stat-card { --c: var(--accent); text-align: left; padding: 16px 18px; height: 100%; overflow: hidden; }
        .stat-card::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--c); opacity: .85;
        }
        .stat-ico { position: absolute; right: 14px; top: 14px; width: 22px; height: 22px; color: var(--c); opacity: .9; }
        .stat-label { font-size: .72rem; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
        .stat-value { font-size: 1.6rem; font-weight: 800; font-family: var(--mono); margin-top: 8px; color: var(--c); line-height: 1.1; }
        .stat-sub { font-size: .74rem; color: var(--muted); margin-top: 6px; }

        .chart-box { height: 300px; width: 100%; background: var(--code-bg); border-radius: 10px; }

        /* ── 请求表 ── */
        .req-table { width: 100%; font-size: .86rem; }
        .req-table th {
            color: var(--muted); font-weight: 600; text-transform: uppercase;
            font-size: .72rem; letter-spacing: .5px; border-bottom: 1px solid var(--border);
            padding: 9px 10px; text-align: left; white-space: nowrap;
        }
        .req-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .req-table tbody tr.request-row { cursor: pointer; }
        .req-table tbody tr.request-row:hover { background: var(--row-hover); }
        .req-table .msg-preview { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }

        .badge-status {
            font-size: .7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700;
            white-space: nowrap; font-family: var(--mono); border: 1px solid transparent;
        }
        .status-ok     { background: var(--badge-ok-bg); color: var(--badge-ok-fg); border-color: var(--badge-ok-fg); }
        .status-fail   { background: var(--badge-fail-bg); color: var(--badge-fail-fg); border-color: var(--badge-fail-fg); }
        .status-pending{ background: var(--badge-warn-bg); color: var(--badge-warn-fg); border-color: var(--badge-warn-fg); }

        /* ── 展开 trace 时间线 ── */
        .trace-detail { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
        .stage-label {
            font-size: .72rem; font-weight: 700; color: var(--accent); text-transform: uppercase;
            letter-spacing: .6px; padding: 4px 2px 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
        }
        .span-line { display: flex; align-items: center; gap: 11px; padding: 6px 0; font-size: .82rem; border-bottom: 1px dashed var(--border); }
        .span-line:last-child { border-bottom: none; }
        /* 工具轮分组：节标题 + 轮内成员左缩进 + 引导线 */
        .round-header {
            display: flex; align-items: center; gap: 8px;
            margin: 14px 0 6px; padding: 4px 10px;
            font-size: .74rem; font-weight: 700; letter-spacing: .4px;
            font-family: var(--mono);
            color: var(--accent-2); background: var(--code-bg);
            border-left: 2px solid var(--accent); border-radius: 5px;
        }
        .round-header svg { width: 13px; height: 13px; }
        .span-line.round { margin-left: 16px; position: relative; }
        .span-line.round::before {
            content: ""; position: absolute; left: -14px; top: 0; bottom: 0;
            width: 1px; background: var(--border);
        }
        .tl-icon { width: 21px; height: 21px; flex-shrink: 0; color: var(--info); }
        .tl-icon.ok { color: var(--ok); }
        .tl-icon.warn { color: var(--accent-2); }
        .tl-icon.err { color: var(--danger); }
        .tl-icon svg { width: 100%; height: 100%; }
        .span-name { font-weight: 600; font-family: var(--mono); font-size: .82rem; }
        .span-meta { color: var(--muted); font-size: .76rem; }
        .span-ms { font-weight: 700; color: var(--accent); margin-left: auto; white-space: nowrap; font-family: var(--mono); }
        .arrow-indicator { color: var(--disc-fg); transition: transform .15s; display: inline-flex; }
        /* LLM 调用行可点击展开完整输入/返回 */
        .span-line.clickable { cursor: pointer; }
        .span-line.clickable:hover { background: var(--row-hover); }
        .tl-detail {
            margin: 4px 0 12px 32px; background: var(--card-solid);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 14px; font-family: var(--mono); font-size: .78rem;
            overflow: auto; max-height: 380px;
        }
        .tl-detail h4 {
            font-size: .72rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: .5px; margin: 10px 0 6px; font-family: var(--mono);
        }
        .tl-detail h4:first-child { margin-top: 0; }
        .tl-detail pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--code-fg); }
        .tl-hint { color: var(--muted); font-size: .74rem; margin: 0 0 4px; }
        .arrow-indicator svg { width: 16px; height: 16px; }

        .empty-state { text-align: center; padding: 30px 16px; color: var(--muted); }
        .empty-state svg { width: 34px; height: 34px; color: var(--empty-ico); margin-bottom: 10px; }
        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite;
            border-radius: 8px; height: 150px;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .refresh-spinner { font-size: .78rem; color: var(--muted); margin-left: auto; font-weight: 400; }
        .refresh-spinner svg { width: 13px; height: 13px; vertical-align: -3px; margin-right: 4px; }
        .footer-hint { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 26px; font-family: var(--mono); }

        /* ── Bootstrap 覆盖 ── */
        .spin { animation: rotation 1s linear infinite; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } }
        a, .text-primary { color: var(--accent); }
        .text-success { color: var(--ok) !important; }
        .text-danger { color: var(--danger) !important; }
        .text-muted, .text-secondary { color: var(--muted) !important; }
        .badge.bg-primary { background: var(--accent) !important; color: var(--accent-ink); }
        .badge.bg-secondary { background: var(--chip-muted-bg) !important; color: var(--chip-muted-fg); }
        .badge.bg-info { background: var(--chip-info-bg) !important; color: var(--chip-info-fg); }
    </style>
</head>

<div class="container">

    <!-- ═══════ 指标卡片 ═══════ -->

    <div class="glass-card mt-4">

</div>

<script>
/* ==========================================================
 *  观测面板：指标卡片 + 5 图 + 最近请求表(可展开 trace)

/* ---------- 内联 SVG 图标库（Lucide 风格，禁止 Emoji） ---------- */
const IC = {
    activity:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.48 12H2"/>',

    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
    bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',

    rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',

    wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
    volume:'<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
    check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    alertTri:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>',
    alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
    chev:'<path d="m9 18 6-6-6-6"/>',
    dot:'<circle cx="12" cy="12" r="4"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
};
function svg(paths, extra) {
    return '<svg class="' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

/* LLM 调用作用标注（后端 llm_call.purpose）→ 中文显示；未知则回退原文 */
const LLM_PURPOSE = {
    'camera_view': '看用户画面',
    'tone_probe': '语气探测',
    'tool_reply': '工具回复',
    'chat_reply': '流式回复',
    'compress': '摘要压缩',
    'longterm_select': '记忆召回',
    'longterm_extract': '记忆提取',
    'longterm_merge': '记忆合并',
    'reminder_reply': '提醒回复',
};
function purposeLabel(p) { return (LLM_PURPOSE[p] || p || '未标注'); }

let trendChart, modelChart, donutChart, stageChart, ttsChart;
let POLL = 5000;
let pollTimer = null;   // 自动刷新定时器
let autoEnabled = false; // 自动刷新开关（默认关，需用户开启）

const C_OK = '#059669', C_FAIL = '#e11d48', C_ACC = '#0d9488';
const C_ACC2 = '#d97706', C_SKY = '#0284c7', C_ORG = '#ea580c';
/* ECharts 调色板：随主题（CSS 变量）读取 */
let PAL = { axis:'', split:'', theme:'', tiBg:'', tiBorder:'', donutBorder:'' };
function syncPalette() {
    const g = getComputedStyle(document.documentElement);
    PAL.axis = g.getPropertyValue('--chart-axis').trim() || '#7b8aa0';
    PAL.split = g.getPropertyValue('--chart-split').trim() || 'rgba(15,23,42,.08)';
    PAL.theme = g.getPropertyValue('--chart-text').trim() || '#223049';
    PAL.tiBg = g.getPropertyValue('--chart-tipbg').trim() || 'rgba(255,255,255,.98)';
    PAL.tiBorder = g.getPropertyValue('--chart-tipborder').trim() || 'rgba(15,23,42,.14)';
    PAL.donutBorder = g.getPropertyValue('--card-solid').trim() || '#ffffff';
}

function fmtMs(ms) {
    if (ms === null || ms === undefined) return '—';
    if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
    return Math.round(ms) + 'ms';
}
function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
}

/* ---------- 指标卡片 ---------- */
function renderStats(s) {
    const rt = s.response_time || {};
    const pl = s.pipeline || {};
    const tk = s.total_tokens || {};
    const cells = [
        { label: '成功率', value: (s.success_rate * 100).toFixed(1) + '%', sub: (s.success || 0) + ' / ' + (s.traces || 0) + ' 成功', color: C_OK, ico: 'activity' },
        { label: '平均响应', value: fmtMs(rt.avg), sub: '聊天段 trace_start→end', color: C_ACC, ico: 'timer' },
        { label: 'P50 / P90', value: fmtMs(rt.p50) + ' / ' + fmtMs(rt.p90), sub: '聊天响应分位', color: C_ACC, ico: 'clock' },
        { label: '全链路平均', value: fmtMs(pl.avg), sub: '全链路 P90 ' + fmtMs(pl.p90), color: C_SKY, ico: 'layers' },
        { label: 'LLM 调用', value: String(s.total_llm_calls || 0), sub: (s.tool_rounds || 0) + ' 轮工具 / ' + (s.total_tool_calls || 0) + ' 次', color: C_ACC2, ico: 'bot' },
        { label: '总 Token', value: ((tk.total || 0) / 1000).toFixed(1) + 'k', sub: '入 ' + (tk.input || 0) + ' / 出 ' + (tk.output || 0), color: C_ACC2, ico: 'hash' },
    ];
    let html = cells.map(c => `
        <div class="col-6 col-md-3">
            <div class="glass-card stat-card" style="--c:${c.color}">
                <span class="stat-ico">${svg(IC[c.ico])}</span>
                <div class="stat-value">${c.value}</div>
                <div class="stat-label">${c.label}</div>
                ${c.sub ? `<div class="stat-sub">${c.sub}</div>` : ''}
            </div>
        </div>`).join('');
    $('#statCards').html(html);
}

/* ---------- 全链路阶段指标卡（ASR / TTS） ---------- */
function renderStageStats(s) {
    const asr = s.asr || {}, tts = s.tts || {};
    const asrRate = (asr.success_rate * 100).toFixed(1) + '%';
    const cells = [
        { label: 'ASR 调用', value: String(asr.calls || 0), sub: '语音识别次数', color: C_SKY, ico: 'mic' },
        { label: 'ASR 成功率', value: asrRate, sub: (asr.calls || 0) + ' 次识别', color: C_OK, ico: 'check' },
        { label: 'ASR 平均推理', value: fmtMs(asr.avg_ms), sub: '总音频 ' + fmtMs(asr.total_audio_ms), color: C_SKY, ico: 'timer' },
        { label: 'ASR 平均 RTF', value: (asr.avg_rtf || 0).toFixed(2) + 'x', sub: '实时率（<1 更快）', color: C_SKY, ico: 'gauge' },
        { label: 'TTS 句子', value: String(tts.calls || 0), sub: '合成句数', color: C_ORG, ico: 'msg' },
        { label: 'TTS 成功率', value: ((tts.success_rate || 0) * 100).toFixed(1) + '%', sub: '平均 ' + fmtMs(tts.avg_ms), color: C_OK, ico: 'check' },
        { label: 'TTS 重试', value: String(tts.retry_count || 0), sub: '含失败重试', color: C_ORG, ico: 'repeat' },
        { label: 'TTS 截断', value: String(tts.truncation_count || 0), sub: '断流/过短', color: C_ORG, ico: 'alert' },
    ];
    const html = cells.map(c => `
        <div class="col-6 col-md-3">
            <div class="glass-card stat-card" style="--c:${c.color}">
                <span class="stat-ico">${svg(IC[c.ico])}</span>
                <div class="stat-value">${c.value}</div>
                <div class="stat-label">${c.label}</div>
                ${c.sub ? `<div class="stat-sub">${c.sub}</div>` : ''}
            </div>
        </div>`).join('');
    $('#stageCards').html(html);
}

/* ---------- 图表 ---------- */
function ensureCharts() {
    if (!trendChart) trendChart = echarts.init(document.getElementById('chartTrend'));
    if (!modelChart) modelChart = echarts.init(document.getElementById('chartModel'));
    if (!donutChart) donutChart = echarts.init(document.getElementById('chartDonut'));
    if (!stageChart) stageChart = echarts.init(document.getElementById('chartStage'));
    if (!ttsChart) ttsChart = echarts.init(document.getElementById('chartTTS'));
    window.addEventListener('resize', () => {
        trendChart.resize(); modelChart.resize(); donutChart.resize();
        stageChart.resize(); ttsChart.resize();
    });
}
/* 暗色 tooltip / 坐标轴 通用配置 */
function tipStyle() {
    return { backgroundColor: PAL.tiBg, borderColor: PAL.tiBorder, textStyle: { color: PAL.theme, fontSize: 12 } };
}
function axisLabel(color) { return { fontSize: 10, color: color || PAL.axis }; }

function renderCharts(s, requests) {
    ensureCharts();
    syncPalette();
    const reqs = (requests || []).slice().reverse(); // 变旧→新
    // 趋势折线
    trendChart.setOption({
        grid: { left: 48, right: 16, top: 24, bottom: 34 },
        tooltip: Object.assign({ trigger: 'axis' }, tipStyle()),
        xAxis: { type: 'category', data: reqs.map(r => fmtTime(r.ts)), axisLabel: axisLabel(), axisLine: { lineStyle: { color: PAL.split } } },
        yAxis: { type: 'value', axisLabel: Object.assign({ formatter: v => v + 'ms' }, axisLabel()), splitLine: { lineStyle: { color: PAL.split } } },
        legend: { bottom: 0, textStyle: { fontSize: 11, color: PAL.axis } },
        series: [
            {
                name: '响应耗时(聊天段)', type: 'line', smooth: true, symbol: 'circle', symbolSize: 6,
                data: reqs.map(r => r.elapsed_ms),
                lineStyle: { color: C_ACC, width: 2 },
                itemStyle: { color: C_ACC },
                areaStyle: { color: { type: 'linear', x:0,y:0,x2:0,y2:1,
                    colorStops: [{offset:0,color:'rgba(13,148,136,.28)'},{offset:1,color:'rgba(13,148,136,0)'}] } }
            },
            {
                name: '全链路(ASR→TTS)', type: 'line', smooth: true, symbol: 'rect', symbolSize: 6,
                data: reqs.map(r => r.pipeline_ms),
                lineStyle: { color: C_SKY, width: 2, type: 'dashed' },
                itemStyle: { color: C_SKY }
            }
        ]
    }, true);
    // 各模型平均耗时柱状
    const models = s.per_model || [];
    modelChart.setOption({
        grid: { left: 48, right: 16, top: 20, bottom: 44 },
        tooltip: Object.assign({ trigger: 'axis' }, tipStyle()),
        xAxis: { type: 'category', data: models.map(m => m.model), axisLabel: Object.assign({ interval: 0, rotate: 20 }, axisLabel()), axisLine: { lineStyle: { color: PAL.split } } },
        yAxis: { type: 'value', axisLabel: Object.assign({ formatter: v => v + 'ms' }, axisLabel()), splitLine: { lineStyle: { color: PAL.split } } },
        series: [{
            name: '平均耗时', type: 'bar', barMaxWidth: 46,
            data: models.map(m => ({ value: m.avg_elapsed_ms, itemStyle: { color: C_ACC, borderRadius: [4,4,0,0] } })),
            label: { show: true, position: 'top', fontSize: 9, color: PAL.axis, formatter: p => p.value + 'ms' }
        }]
    }, true);
    // 成功/失败环图
    const ok = s.success || 0, fail = (s.traces || 0) - ok;
    donutChart.setOption({
        tooltip: Object.assign({ trigger: 'item', formatter: p => p.name + ': ' + p.value + ' (' + p.percent + '%)' }, tipStyle()),
        legend: { bottom: 0, textStyle: { fontSize: 11, color: PAL.axis } },
        series: [{
            type: 'pie', radius: ['46%', '68%'], center: ['50%', '44%'], avoidLabelOverlap: false,
            label: { show: true, formatter: '{b}\n{d}%', fontSize: 11, color: PAL.theme },
            itemStyle: { borderColor: PAL.donutBorder, borderWidth: 2 },
            data: [
                { value: ok, name: '成功', itemStyle: { color: C_OK } },
                { value: fail, name: '失败', itemStyle: { color: C_FAIL } }
            ]
        }]
    }, true);
    // 各阶段平均耗时（ASR → LLM → TTS）
    const llmCalls = s.total_llm_calls || 0;
    let llmAvg = 0;
    if (s.per_model && llmCalls) {
        llmAvg = s.per_model.reduce((a, m) => a + (m.avg_elapsed_ms || 0) * (m.calls || 0), 0) / llmCalls;
    }
    const stageData = [
        { name: 'ASR', value: (s.asr && s.asr.avg_ms) || 0, color: C_SKY },
        { name: 'LLM', value: llmAvg, color: C_ACC },
        { name: 'TTS', value: (s.tts && s.tts.avg_ms) || 0, color: C_ORG },
    ];
    stageChart.setOption({
        grid: { left: 52, right: 16, top: 26, bottom: 26 },
        tooltip: Object.assign({ trigger: 'axis', formatter: p => p[0].name + ' 平均: ' + fmtMs(p[0].value) }, tipStyle()),
        xAxis: { type: 'category', data: stageData.map(d => d.name), axisLabel: Object.assign({ fontSize: 12 }, axisLabel()), axisLine: { lineStyle: { color: PAL.split } } },
        yAxis: { type: 'value', axisLabel: Object.assign({ formatter: v => v + 'ms' }, axisLabel()), splitLine: { lineStyle: { color: PAL.split } } },
        series: [{
            name: '平均耗时', type: 'bar', barMaxWidth: 64,
            data: stageData.map(d => ({ value: Math.round(d.value), itemStyle: { color: d.color, borderRadius: [5,5,0,0] } })),
            label: { show: true, position: 'top', fontSize: 10, color: PAL.theme, formatter: p => p.value + 'ms' }
        }]
    }, true);
    // TTS 合成成功率环图
    const ttsTotal = (s.tts && s.tts.calls) || 0;
    const ttsOk = Math.round(((s.tts && s.tts.success_rate) || 0) * ttsTotal);
    if (ttsTotal > 0) {
        ttsChart.setOption({
            tooltip: Object.assign({ trigger: 'item', formatter: p => p.name + ': ' + p.value + ' (' + p.percent + '%)' }, tipStyle()),
            series: [{
                type: 'pie', radius: ['46%', '68%'], center: ['50%', '44%'], avoidLabelOverlap: false,
                label: { show: true, formatter: '{b}\n{d}%', fontSize: 11, color: PAL.theme },
                itemStyle: { borderColor: PAL.donutBorder, borderWidth: 2 },
                data: [
                    { value: ttsOk, name: '成功', itemStyle: { color: C_OK } },
                    { value: ttsTotal - ttsOk, name: '失败', itemStyle: { color: C_FAIL } }
                ]
            }]
        }, true);
    } else { ttsChart.clear(); }
}

/* ---------- 最近请求表 ---------- */
let expanded = {}; // trace_id -> 是否展开

/* 工具列单元格：列出本请求用到的工具名；无工具则「—」 */
function toolCell(r) {
    const tools = r.tools || [];
    if (!tools.length) return '—';
    return tools.map(esc).join(', ');
}
/* 工具列 title 提示：调用次数 */
function toolTip(r) {
    if (!r.tool_count) return '未调用工具';
    return r.tools.join(', ') + ' · 共 ' + r.tool_count + ' 次调用';
}

function renderRequests(requests) {
    const body = $('#reqBody');
    if (!requests.length) {
        body.html('<tr><td colspan="10" class="empty-state">' + svg(IC.msg) + '暂无请求，发送一句对话后自动出现。</td></tr>');
        $('#reqCount').text(0);
        return;
    }
    $('#reqCount').text(requests.length);
    let html = '';
    requests.forEach(r => {
        const ok = r.success === null ? 'pending' : (r.success ? 'ok' : 'fail');
        const label = r.success === null ? '进行中' : (r.success ? '成功' : '失败');
        const arrow = expanded[r.trace_id] ? 'rotate(90deg)' : '';
        html += `
        <tr class="request-row" data-tid="${r.trace_id}">
            <td style="white-space:nowrap">${fmtTime(r.ts)}</td>
            <td style="white-space:nowrap" class="text-muted">${esc(String(r.session_id||'').slice(0,12))}</td>
            <td class="msg-preview" title="${esc(r.msg_preview||'')}">${esc(r.msg_preview||'')}</td>
            <td class="text-muted">${fmtMs(r.elapsed_ms)}</td>
            <td class="text-muted">${fmtMs(r.pipeline_ms)}</td>
            <td><span class="badge-status status-${ok}">${label}</span></td>
            <td>${r.tool_rounds == null ? '—' : r.tool_rounds}</td>
            <td class="msg-preview" title="${esc(toolTip(r))}">${toolCell(r)}</td>
            <td>${r.llm_calls == null ? '—' : r.llm_calls}</td>
            <td><span class="arrow-indicator" style="transform:${arrow}">${svg(IC.chev)}</span></td>
        </tr>
        <tr class="trace-row" data-tid="${r.trace_id}" style="display:${expanded[r.trace_id] ? '' : 'none'}">
            <td colspan="10">${expanded[r.trace_id] ? '<div class="trace-detail">加载中...</div>' : ''}</td>
        </tr>`;
    });
    body.html(html);
}

$(document).on('click', '.request-row', function () {
    const tid = $(this).data('tid');
    expanded[tid] = !expanded[tid];
    renderRequests(lastRequests || []);
    loadTrace(tid);
});

function loadTrace(tid) {
    // 全链路（ASR→LLM/工具→TTS）已拼在同一条 trace：直接渲染 request 全部事件，
    // 时间线按 seq 升序，asr_call 自然排在最前。
    fetch('/api/obs/request/' + tid).then(r => r.json()).then(j => {
        const evs = (j.data && j.data.events) || [];
        const html = renderTimeline(evs);
        $('.trace-row[data-tid="' + tid + '"] .trace-detail').html(html || '<div class="empty-state">' + svg(IC.msg) + '无事件</div>');
    }).catch(() => {});
}

function renderTimeline(evs) {
    if (!evs.length) return '<div class="empty-state">' + svg(IC.msg) + '无事件</div>';
    // 工具轮分组：span 设计保留，但页面不再把 tool_round 当普通一行重复展示，
    // 而是转成“节标题”，把该轮内真正调用的 llm_call / tool_call 缩进成一组。
    // 注意 seq 顺序里 tool_round 排在子事件之后，故先建 span_id→{轮号,次数} 映射，
    // 再由子事件的 parent_id 归入对应轮，首次遇到该轮成员时补一节标题。
    const roundOf = {};
    for (const ev of evs) {
        if (ev.type === 'tool_round' && ev.n_tool_calls > 0) {
            roundOf[ev.span_id] = { round: ev.round, n: ev.n_tool_calls };
        }
    }
    const shownHeader = {};
    const ICON = { trace_start:'rocket', llm_call:'bot', tool_call:'wrench',
                   trace_end:'check', asr_call:'mic', tts_call:'volume' };
    const lines = [];
    for (const ev of evs) {
        if (ev.type === 'tool_round') continue; // 已转成上方节标题
        const r = roundOf[ev.parent_id];
        if (r && !shownHeader[ev.parent_id]) {
            shownHeader[ev.parent_id] = true;
            lines.push(`<div class="round-header">${svg(IC.repeat)}工具轮 ${r.round} · ${r.n} 次调用</div>`);
        }
        let key = ICON[ev.type] || 'dot';
        let cls = '';
        let name = '', meta = '';
        let detailHtml = '';   // 可展开的完整输入/返回详情（仅 llm_call 填充）
        if (ev.type === 'trace_start') { name = '请求开始'; meta = '工具模式: ' + (ev.tool_mode ? '开' : '关'); }
        else if (ev.type === 'trace_end') {
            key = 'check'; name = '请求结束';
            cls = ev.fail_reason ? 'err' : 'ok';
            meta = ev.fail_reason ? ('失败: ' + ev.fail_reason) : '成功';
        }
        else if (ev.type === 'llm_call') {
            key = 'bot';
            name = 'LLM ' + (ev.mode === 'stream' ? '流式' : '调用') + ' · ' + purposeLabel(ev.purpose);
            meta = `${ev.model || ev.route || '?'} · 入${ev.input_tokens||0}/出${ev.output_tokens||0}tok` +
                   (ev.has_tools ? ' · tools' : '') + (ev.success ? '' : ' · ' + (ev.fail_reason||'失败'));
            cls = ev.success ? '' : 'err';
            // 完整输入上下文 + 返回数据（现在 llm_call 事件里都有，特别是面熟可展开）
            if (ev.messages || ev.output !== undefined) detailHtml = llmDetailHTML(ev);
        }
        else if (ev.type === 'tool_call') {
            key = 'wrench';
            name = '工具 ' + (ev.tool || '?');
            meta = esc(ev.args ? ev.args.slice(0,60) : '') + (ev.success ? '' : ' · ' + esc(ev.error||'失败'));
            if (ev.result_snippet) meta += '  → ' + esc(ev.result_snippet.slice(0,60));
            cls = ev.success ? '' : 'err';
        }
        else if (ev.type === 'asr_call') {
            key = 'mic';
            name = 'ASR 转录';
            meta = '推理 ' + fmtMs(ev.inference_ms) + ' · RTF ' + (ev.rtf || 0).toFixed(2) +
                   (ev.text ? '  → ' + esc(ev.text) : '') +
                   (ev.success ? '' : ' · ' + esc(ev.fail_reason||'失败'));
            cls = ev.success ? '' : 'err';
        }
        else if (ev.type === 'tts_call') {
            key = 'volume';
            name = 'TTS 合成';
            meta = (ev.provider ? esc(ev.provider) + ' · ' : '') + '音频 ' + fmtMs(ev.audio_ms) +
                   ' · 尝试 ' + (ev.attempts || 1) +
                   (ev.retried ? ' · 重试' : '') + (ev.truncated ? ' · 截断' : '') +
                   (ev.success ? '' : ' · ' + esc(ev.fail_reason||'失败'));
            cls = ev.success ? '' : 'err';
        }
        const rowCls = r ? 'span-line round' : 'span-line';
        const clickable = detailHtml ? ' clickable' : '';
        const seq = ev.seq != null ? ev.seq : 't' + (ev.trace_id || '') + '_' + (name || '');
        lines.push(`<div class="${rowCls}${clickable}" data-tl-seq="${seq}"><span class="tl-icon ${cls}">${svg(IC[key] || IC.dot)}</span>
            <span class="span-name">${esc(name)}</span>
            <span class="span-meta">${meta}</span>
            ${ev.elapsed_ms != null ? `<span class="span-ms">${fmtMs(ev.elapsed_ms)}</span>` : ''}</div>`);
        if (detailHtml) lines.push(`<div class="tl-detail" data-tl-seq="${seq}" style="display:none">${detailHtml}</div>`);
    }
    return lines.join('');
}

/* 把某次 LLM 调用的完整输入与返回渲染成可折叠详情（纯展示）。 */
function llmDetailHTML(ev) {
    let h = '';
    if (ev.messages && ev.messages.length) {
        h += '<h4>完整输入 messages</h4>';
        h += '<pre>' + esc(JSON.stringify(ev.messages, null, 2)) + '</pre>';
    }
    if (ev.output !== undefined && ev.output !== null && ev.output !== '') {
        h += '<h4>返回 output</h4>';
        const out = (typeof ev.output === 'string') ? ev.output : JSON.stringify(ev.output, null, 2);
        h += '<pre>' + esc(out) + '</pre>';
    }
    if (!h) return '<p class="tl-hint">未记录输入上下文/返回数据（旧事件）</p>';
    return h;
}

/* 点击可展开的 LLM 调用行 → 显示完整输入/返回。 */
$(document).on('click', '.span-line.clickable', function () {
    const seq = $(this).data('tlSeq');
    $(this).siblings('.tl-detail[data-tl-seq="' + seq + '"]').toggle();
});

/* ---------- 主题切换 ---------- */
function applyTheme() {
    const saved = localStorage.getItem('lt-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme'); // 默认亮色
    refreshThemeIco();
}
function refreshThemeIco() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('#themeToggle').html(svg(dark ? IC.sun : IC.moon, 'themeIco') + '<span class="d-none d-sm-inline"> ' + (dark ? '亮色' : '暗色') + '</span>');
}
function toggleTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('lt-theme', 'light'); }
    else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('lt-theme', 'dark'); }
    refreshThemeIco();
    refreshAll(); // 重新读取调色板并重绘图表
}

/* ---------- 刷新 / 自动刷新 ---------- */
let lastRequests = [];

function toggleAuto() {
    autoEnabled = !autoEnabled;
    const btn = $('#autoToggle');
    if (autoEnabled) {
        btn.removeClass('btn-outline-light').addClass('btn-primary active');
        btn.html(svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>', 'autoIco') + ' 停止自动刷新');
        $('#refreshInfo').html(svg(IC.repeat, 'spin') + ' 自动刷新中（5s）');
        pollTimer = setInterval(refreshAll, POLL);
    } else {
        btn.addClass('btn-outline-light').removeClass('btn-primary active');
        btn.html(svg('<polygon points="6 3 20 12 6 21 6 3"/>', 'autoIco') + ' 自动刷新');
        $('#refreshInfo').text('手动刷新');
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
}

async function refreshAll() {
    try {
        const [sr, rr] = await Promise.all([
            fetch('/api/obs/summary?window=3600').then(r => r.json()),
            fetch('/api/obs/requests?limit=50').then(r => r.json()),
        ]);
        const s = sr.data || {}, re = (rr.data && rr.data.requests) || [];
        lastRequests = re;
        renderStats(s);
        renderStageStats(s);
        renderCharts(s, re);
        renderRequests(re);
        // 保持当前展开的 trace 在新一轮刷新后仍展开，并重新拉取最新明细
        const openTids = Object.keys(expanded).filter(tid => expanded[tid]);
        openTids.forEach(tid => {
            if (re.some(r => r.trace_id === tid)) loadTrace(tid);
        });
    } catch (e) { /* 瞬时错误忽略 */ }
}

$(function () {
    applyTheme();                            // 应用已保存主题（默认亮色）
    $('#refreshInfo').text('手动刷新');       // 默认关闭自动刷新
    refreshAll();                             // 进入时拉取一次
});
</script>
