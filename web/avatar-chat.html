<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>全屏语音对话</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2308090d'/><path d='M20 28v8M28 22v20M36 16v32M44 24v16' stroke='%2351d6c2' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#07080c;
            --panel:#12151c;
            --surface-hi:rgba(255,255,255,.09);
            --surface-lo:rgba(255,255,255,.04);
            --border:rgba(255,255,255,.10);
            --border-strong:rgba(255,255,255,.18);
            --text:#eef1f7;
            --text-dim:#9aa4b6;
            --text-faint:#6b7486;
            --accent:#51d6c2;
            --accent-soft:rgba(81,214,194,.16);
            --accent-hi:#7eeada;
            --violet:#8f8ef7;
            --danger:#ff6b5e;
            --warn:#f0b45a;
            --mono:'JetBrains Mono',ui-monospace,"Cascadia Mono",Consolas,monospace;
            --sans:'Sora','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 全屏展示层：默认撑满视口 =====
         * 数字人实时视频是页面唯一主视觉，故不叠加 Pexels 摄影；
         * 只在其背后垫一层极淡的电影感环境(供 object-fit 留黑处呼吸)。
         * TODO: 需换背景图时改此处 URL（Pexels / 本地资源均可）。*/
        #stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(120% 80% at 70% 16%, rgba(81,214,194,.07), transparent 55%),
                radial-gradient(130% 100% at 14% 96%, rgba(143,142,247,.05), transparent 50%),
                linear-gradient(180deg,#0a0b10,#05060a);
        }
        #stage::before {
            content: '';
            position: absolute;
            inset: -40px;
            z-index: 0;
            background: url('https://images.pexels.com/photos/3407862/pexels-photo-3407862.jpeg') center/cover no-repeat;
            filter: blur(24px) brightness(.4) saturate(.75);
            opacity: .34;
        }
        #video {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;   /* 透明，让留黑处透出环境背景 */
            z-index: 1;
        }
        #audio { display: none; }
        /* 轻微暗角，把画面与四周环境统一起来 */
        #stage::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(130% 110% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
        }

        /* ===== 底部悬浮操作栏（玻璃拟态） ===== */
        #bar {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;   /* 一行放不下时换行而非把按钮挤出/压扁 */
            gap: 6px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(16,19,26,.72);
            backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid var(--border-strong);
            box-shadow: 0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
            max-width: 92vw;
        }
        .bar-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text);
            background: transparent;
            white-space: nowrap;
            transition: background .16s, color .16s, transform .12s;
        }
        .bar-btn:hover { background: var(--surface-hi); }
        .bar-btn:active { transform: translateY(1px); }
        .bar-btn:hover svg, .bar-btn.active svg, .bar-btn.active { color: var(--accent-hi); }
        .bar-btn .ic {
            width: 18px; height: 18px;
            fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            color: inherit;
        }
        .bar-btn.active { background: var(--accent-soft); }
        /* 通话按钮：独立的强调色块，激活态切换为红色 */
        #btn-call {
            background: linear-gradient(180deg,#2b725f,#1f5c4e);
            color: #eafff9;
            box-shadow: 0 4px 14px rgba(40,160,140,.35), inset 0 1px 0 rgba(255,255,255,.15);
        }
        #btn-call:hover { background: linear-gradient(180deg,#2f816b,#236b59); color: #eafff9; }
        #btn-call:active { transform: translateY(1px); }
        #btn-call.active {
            background: linear-gradient(180deg,#d8564a,#c24338);
            box-shadow: 0 4px 14px rgba(220,80,70,.35), inset 0 1px 0 rgba(255,255,255,.15);
            color: #fff;
        }
        #btn-call.active:hover { background: linear-gradient(180deg,#e06052,#cd4b40); color: #fff; }
        #btn-call .ic { color: inherit; }
        .bar-btn .mic-off { display: none; }
        #btn-call.active .mic-off { display: block; }
        #btn-call.active .mic { display: none; }

        #btn-camera { color: var(--text-secondary); }
        #btn-camera .cam-on { display: none; }
        #btn-camera .cam-off { display: block; }
        #btn-camera.active { color: #ffcf5b; }
        #btn-camera.active .cam-on { display: block; }
        #btn-camera.active .cam-off { display: none; }

                #msg {
            flex: 1;
            min-width: 70px;   /* 让出空间给工具栏新增按钮，避免一行塞不下把右侧按钮挤出 */
            padding: 11px 16px;
            font-size: 14px;
            color: #fff;
            font-family: inherit;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            outline: none;
            transition: border-color .15s, background .15s, box-shadow .15s;
        }
        #msg::placeholder { color: var(--text-faint); }
        #msg:focus { background: rgba(255,255,255,.07); border-color: rgba(81,214,194,.55); box-shadow: 0 0 0 3px rgba(81,214,194,.12); }

        /* ===== 字幕浮层：底部 #bar 上方，居中半透明，不挡点击 ===== */
        #subtitle {
            position: fixed;
            left: 50%;
            bottom: 108px;
            transform: translateX(-50%);
            z-index: 15;
            max-width: 76vw;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.08);
            color: #fff;
            font-size: 19px;
            line-height: 1.55;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,.7);
            word-break: break-word;
            pointer-events: none;
            box-shadow: 0 8px 28px rgba(0,0,0,.35);
        }

        /* ===== 模型响应耗时徽标：检测到语音(结束) → 数字人开始合成语音 ===== */
        #resptime {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 16;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px 7px 11px;
            border-radius: 10px;
            background: rgba(10,12,18,.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-strong);
            color: var(--accent-hi);
            font: 500 13px var(--mono);
            letter-spacing: .02em;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .4s, transform .4s;
        }
        #resptime::before {
            content: '';
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(81,214,194,.9);
        }
        #resptime.measuring { color: var(--warn); }
        #resptime.measuring::before {
            background: var(--warn);
            box-shadow: 0 0 12px rgba(240,180,90,.9);
            animation: pulse 1s ease-in-out infinite;
        }

        /* ===== 设置弹窗 ===== */
        #modal-mask {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(5,6,9,.6);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #modal-mask.open { display: flex; }
        #modal {
            width: 480px;
            max-width: 92vw;
            max-height: 86vh;
            overflow: auto;
            background: linear-gradient(180deg,#151a23,#0f131b);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 22px 26px 18px;
            box-shadow: 0 24px 70px rgba(0,0,0,.65);
        }
        #modal h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: .02em;
        }
        #modal h3::before {
            content: '';
            width: 4px; height: 14px; border-radius: 2px;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(81,214,194,.5);
        }
        #modal h3:first-child { margin-top: 0; }
        #modal textarea, #modal input[type="text"], #modal input[type="url"], #modal input[type="email"] {
            width: 100%;
            box-sizing: border-box;
            background: #0b0e14;
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #modal textarea { resize: vertical; }
        #modal textarea:focus, #modal input[type="text"]:focus, #modal input[type="url"]:focus, #modal input[type="email"]:focus {
            border-color: rgba(81,214,194,.55);
            box-shadow: 0 0 0 3px rgba(81,214,194,.12);
        }
        #modal .orig { margin-bottom: 12px; }
        #modal .row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,.03);
            border: 1px solid transparent;
        }
        #modal .row label { cursor: pointer; font-size: 14px; color: var(--text); }
        #modal .row input[type="checkbox"] { accent-color: var(--accent); transform: scale(1.12); cursor: pointer; }
        #modal-close {
            float: right;
            border: 1px solid var(--border-strong);
            cursor: pointer;
            background: var(--surface-hi);
            color: var(--text);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-family: inherit;
        }
        #modal-close:hover { background: var(--surface-hi); color: #fff; }
        #modal .send-btn {
            margin-top: 8px;
            border: none;
            cursor: pointer;
            background: linear-gradient(180deg,#2b725f,#1f5c4e);
            color: #eafff9;
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            transition: filter .15s;
        }
        #modal .send-btn:hover { filter: brightness(1.1); }
        .hint {
            font-size: 12px;
            color: var(--text-faint);
            line-height: 1.6;
        }
        #info_wslink { margin-top: 8px; color: var(--accent-hi); font-size: 13px; }
        #call-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 12px;
            min-height: 18px;
        }
        #call-status:empty { display: none; }
        #call-status::before {
            content: '';
            width: 8px; height: 8px; border-radius: 50%;
            flex: none;
            background: #6b7486;
            box-shadow: 0 0 10px currentColor;
            transition: background .2s;
        }
        #call-status[data-kind="listening"]::before { background: var(--accent); color: var(--accent); animation: pulse 2s infinite; }
        #call-status[data-kind="collecting"]::before { background: var(--accent); color: var(--accent); }
        #call-status[data-kind="speaking"]::before { background: var(--warn); color: var(--warn); }
        #call-status[data-kind="recognizing"]::before, #call-status[data-kind="thinking"]::before, #call-status[data-kind="busy"]::before { background: var(--violet); color: var(--violet); animation: pulse 1s infinite; }
        #call-status[data-kind="interrupt"]::before, #call-status[data-kind="error"]::before { background: var(--danger); color: var(--danger); }
        #call-status[data-kind="warn"]::before { background: var(--warn); color: var(--warn); }
        #call-status[data-kind="off"]::before { background: #3d4452; }

        /* ===== 首次点击前的半透明遮罩 ===== */
        #start-mask {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5,6,10,.42);
            backdrop-filter: blur(2px);
            cursor: pointer;
        }
        .start-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 36px 52px;
            background: rgba(14,17,24,.7);
            border: 1px solid var(--border-strong);
            border-radius: 24px;
            box-shadow: 0 30px 90px rgba(0,0,0,.6);
            animation: cardIn .7s cubic-bezier(.16,1,.3,1) both;
        }
        .start-emblem {
            width: 78px; height: 78px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--accent-soft);
            border: 1px solid rgba(81,214,194,.4);
            color: var(--accent-hi);
            animation: breath 2.6s ease-in-out infinite;
        }
        .start-emblem svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .start-card .title { font-size: 22px; font-weight: 600; letter-spacing: .01em; }
        .start-card .sub { text-align: center; font-size: 13px; color: var(--text-dim); line-height: 1.7; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
        @keyframes breath { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.06); opacity: 1; } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

        @media (max-width: 560px) {
            .bar-btn { padding: 10px 11px; }
            .bar-btn span:not(#call-label) { display: none; }  /* 窄屏只留图标+通话标签 */
        }
    </style>
</head>
<body>

<!-- 全屏展示层 -->
<div id="stage">
    <video id="video" autoplay playsinline muted="false"></video>
    <audio id="audio" autoplay="true"></audio>
    <input type="hidden" id="sessionid" value="0"/>
    <div id="subtitle"></div>
    <div id="resptime"></div>
</div>

<!-- 底部操作栏 -->
<div id="bar">
    <button id="btn-call" class="bar-btn" onclick="toggleVoice()">
        <svg class="ic mic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="21"/></svg>
        <svg class="ic mic-off" aria-hidden="true" viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 10v2a7 7 0 0 0 12 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="21"/></svg>
        <span id="call-label">开启通话</span>
    </button>
    <input id="msg" type="text" placeholder="语音识别结果 / 输入文字直接对话，回车发送" autocomplete="off"/>
    <button id="btn-upload" class="bar-btn" onclick="triggerUpload()" aria-label="上传文件" title="上传文件">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>上传文件</span>
    </button>
    <input id="file-input" type="file" hidden/>
    <button id="btn-fullscreen" class="bar-btn" onclick="toggleFullscreen()" aria-label="全屏">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span>全屏</span>
    </button>
    <button id="btn-subtitle" class="bar-btn active" onclick="toggleSubtitle()" aria-label="字幕">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 15v-3M13 15v-3M17 15v-3M10 12v3"/></svg>
        <span id="subtitle-label">字幕 开</span>
    </button>
    <button id="btn-settings" class="bar-btn" onclick="openSettings()" aria-label="设置">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>设置</span>
    </button>
    <button id="btn-camera" class="bar-btn" onclick="toggleCamera()" aria-label="摄像头">
        <svg class="ic cam-on" aria-hidden="true" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <svg class="ic cam-off" aria-hidden="true" viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M23 7l-7 5 7 5V7z"/><path d="M16 13.5V7a2 2 0 0 0-2-2H6.5"/><path d="M2 19h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="camera-label">摄像头</span>
    </button>
</div>

<!-- 设置弹窗 (藏起原 input text / Use STUN server / asr服务器地址) -->
<div id="modal-mask" onclick="if(event.target===this)closeSettings()">
    <div id="modal">
        <button id="modal-close" onclick="closeSettings()">✕ 关闭</button>

        <h3>文本发送 / Use STUN server</h3>
        <div class="row">
            <input id="use-stun" type="checkbox"/>
            <label for="use-stun" style="cursor:pointer;">Use STUN server</label>
        </div>
        <div class="row">
            <input id="barge-in" type="checkbox" checked="checked"/>
            <label for="barge-in" style="cursor:pointer;">插话：数字人说话时可开口打断</label>
        </div>
        <div class="orig">
            <textarea id="echo-text" rows="2" placeholder="input text：输入一段文字，发送后数字人立即复述">test</textarea>
            <button class="send-btn" onclick="sendEcho()">发送文字</button>
        </div>

        <h3>asr服务器地址(必填)</h3>
        <input id="wssip" type="text" value=""
               onchange="addresschange()"
               placeholder="wss://www.funasr.com:10096/ 或本地 ws://host/api/asr"/>
        <div class="hint" id="asr-hint"></div>

        <h3>热词识别（Hotwords）</h3>
        <textarea id="hotwords" rows="3" placeholder="每行一个热词，空格隔开权重&#10;例如：阿里巴巴 20&#10;　　　　hello world 40"></textarea>
        <div class="hint">一行一个关键字、空格隔开权重，识别时提高命中率。外部 FunASR 服务生效，本地 SenseVoice 端点暂不支持热词加权。</div>

        <a id="wsslink" href="#" onclick="openAuth();return false;"><div id="info_wslink">点此处手工授权（IOS手机）</div></a>

        <div id="call-status"></div>
    </div>
</div>

<!-- 首次点击前的半透明遮罩，点击后进入（建连 + 出声） -->
<div id="start-mask">
    <div class="start-card">
        <div class="start-emblem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </div>
        <div class="title">点击进入对话</div>
        <div class="sub">点击后开启声音<br/>可输入文字或语音交流</div>
    </div>
</div>

<!-- 本地化依赖（web/lib/）：jquery + onnxruntime-web + ricky0123/vad-web，离线可用 -->
<script src="lib/jquery-2.1.1.min.js"></script>
<script src="lib/ort.min.js"></script>
<script src="lib/bundle.min.js"></script>

<script type="text/javascript" charset="utf-8">
    /* ==========================================================
     * 0. 全局状态
     * ========================================================== */
    var pc = null;                 // WebRTC PeerConnection

    function getSessionId() {
        return String(document.getElementById('sessionid').value) || '0';
    }

    /* ==========================================================
     * 1. WebRTC：打开页面即自动连接数字人（改编自 client.js）
     * ========================================================== */
    function startAvatars() {
        var config = { sdpSemantics: 'unified-plan' };
        if (document.getElementById('use-stun').checked) {
            config.iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];
        }
        pc = new RTCPeerConnection(config);
        var gMediaStream = null;   // 自建 MediaStream：统一收集音视频 track

        pc.addEventListener('track', function (evt) {
            // 不依赖 evt.streams（addTransceiver(recvonly) 下可能为空或被拆成多流），
            // 将音视频 track 集中到一个 MediaStream，保证挂到同一视频/音频源。
            if (!gMediaStream) gMediaStream = new MediaStream();
            if (gMediaStream.getTracks().indexOf(evt.track) < 0) gMediaStream.addTrack(evt.track);
            if (evt.track.kind == 'video') {
                var v = document.getElementById('video');
                v.srcObject = gMediaStream;
                // 自动播放策略：带声音首次可能被浏览器拦截（autoplay policy）。
                // 先静音播放保证画面一定出现；首次用户交互时再开声。
                v.muted = true;
                v.play().then(tryUnmute).catch(function () {});
            } else {
                document.getElementById('audio').srcObject = gMediaStream;
            }
        });

        // 尝试开声：仅在 browser 已允许（用户已交互过）时成功，否则继续静音
        function tryUnmute() {
            var v = document.getElementById('video');
            if (!v || !v.srcObject) return;
            var hasAudio = v.srcObject.getTracks().some(function (t) { return t.kind === 'audio'; });
            if (!hasAudio) return;
            v.muted = false;
            v.play().catch(function () {});
        }
        // 首次交互兜底：开声 + 若画面因拦截暂停则重播
        function firstInteraction() {
            tryUnmute();
            var v = document.getElementById('video');
            if (v && v.srcObject) v.play().catch(function () {});
        }
        document.addEventListener('click', firstInteraction, { once: true });
        document.addEventListener('touchstart', firstInteraction, { once: true, passive: true });
        document.addEventListener('keydown', firstInteraction, { once: true });
        // 发起连接前先静音，待轨道到来后自动播放
        document.getElementById('video').muted = true;
        // 连接建立后 sessionid 才填入真实值，届时再开启字幕流（见 negotiate 成功回调）
        negotiate().then(startSubtitle).catch(function () {});
    }

    function negotiate() {
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });
        return pc.createOffer().then(function (offer) {
            return pc.setLocalDescription(offer);
        }).then(function () {
            // 等待 ICE 收集完成
            return new Promise(function (resolve) {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    var checkState = function () {
                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icegatheringstatechange', checkState);
                            resolve();
                        }
                    };
                    pc.addEventListener('icegatheringstatechange', checkState);
                }
            });
        }).then(function () {
            var offer = pc.localDescription;
            return fetch('/offer', {
                body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
                headers: { 'Content-Type': 'application/json' },
                method: 'POST'
            });
        }).then(function (response) {
            return response.json();
        }).then(function (answer) {
            document.getElementById('sessionid').value = answer.sessionid || '0';
            if (camOn) { if (camWS) { try { camWS.close(); } catch (e) {} camWS = null; } camWSLoop(); }  // 会话id就绪后重绑摄像头WS
            return pc.setRemoteDescription(answer);
        }).catch(function (e) {
            console.error('WebRTC negotiate error:', e);
        });
    }

    function stopAvatars() {
        if (pc) {
            var p = pc;
            pc = null;
            setTimeout(function () { try { p.close(); } catch (e) {} }, 500);
        }
    }

    // 用 pagehide/beforeunload 取代 onunload：新版浏览器禁用 unload(sync)，可避免权限策略告警
    window.addEventListener('pagehide', function () { stopAvatars(); });
    window.addEventListener('beforeunload', function () { stopAvatars(); });

    /* ==========================================================
     * 2. 文本输入（echo，直达 TTS）
     * ========================================================== */
    function sendText(text) {
        if (!text) return;
        fetch('/human', {
            body: JSON.stringify({
                text: text,
                type: 'echo',
                interrupt: true,
                sessionid: getSessionId()
            }),
            headers: { 'Content-Type': 'application/json' },
            method: 'POST'
        }).catch(function (er) { console.error('sendText error:', er); });
    }

    /* ==========================================================
     * 3. 语音通话：ricky0123/vad（浏览器内 Silero VAD）+ 后端识别 + LLM
     *    插话(barge-in)：VAD 全程监听。数字人正在说话时用户开口，
     *    onSpeechStart 立即打断它；识别结果入 FIFO 顺序处理，
     *    每条对话带 interrupt:true 覆盖旧回复。回声靠
     *    getUserMedia 的 echoCancellation + 开口抑制窗口 + 可关开关。
     * ========================================================== */

    /* ==========================================================
     * 3.5 模型响应耗时：检测到语音(结束) → 数字人开始合成语音
     * ========================================================== */
    var respStartT = null;           // 本次测量开始时间戳(ms)
    var respTimer = null;            // 徽标淡出定时器

    function startResponseMeasure() {
        var el = document.getElementById('resptime');
        respStartT = Date.now();
        if (el) { el.textContent = '响应中...'; el.classList.add('measuring'); el.style.opacity = '1'; }
    }

    function finishResponseMeasure() {
        if (respStartT === null) return;
        var ms = Date.now() - respStartT;
        respStartT = null;
        var el = document.getElementById('resptime');
        if (!el) return;
        el.classList.remove('measuring');
        el.textContent = '响应耗时 ' + (ms / 1000).toFixed(1) + 's';
        if (respTimer) clearTimeout(respTimer);
        respTimer = setTimeout(function () { el.style.opacity = '0'; }, 6000);
    }

    var callOn = false;              // 语音通话开关
    var myvad = null;                // MicVAD 实例
    var utteranceQueue = [];         // 待识别的语句 FIFO
    var draining = false;            // 顺序处理队列中
    var avatarSpeaking = false;      // 数字人是否正在说话（轮询）
    var pollTimer = null;            // /is_speaking 轮询
    var suppressUntil = 0;           // 回声抑制截止时间戳(ms)
    var suppressMs = 800;            // 数字人开口后抑制自回声时长

    // 状态提示：kind 驱动左侧指示点颜色（idle/listening/speaking/collecting/
    // recognizing/thinking/busy/interrupt/warn/error/off）
    function setCallStatus(msg, kind) {
        var el = document.getElementById('call-status');
        if (!el) return;
        el.textContent = msg || '';
        el.setAttribute('data-kind', kind || 'idle');
    }

    function renderCallBtn() {
        var b = document.getElementById('btn-call');
        var l = document.getElementById('call-label');
        if (l) l.textContent = callOn ? '关闭通话' : '开启通话';
        b.classList.toggle('active', callOn);
    }

    /* ==========================================================
     * 2.5 字幕：订阅 /sse 流，随数字人朗读逐句显示当前句子
     * ========================================================== */
    var subtitleOn = true;      // 字幕开关
    var subtitleES = null;      // /sse EventSource

    function toggleSubtitle() {
        subtitleOn = !subtitleOn;
        var btn = document.getElementById('btn-subtitle');
        var lbl = document.getElementById('subtitle-label');
        var el = document.getElementById('subtitle');
        if (subtitleOn) { startSubtitle(); el.style.display = 'block'; }
        else { stopSubtitle(); el.style.display = 'none'; }
        if (lbl) lbl.textContent = subtitleOn ? '字幕 开' : '字幕 关';
        btn.classList.toggle('active', subtitleOn);
    }

    function startSubtitle() {
        if (subtitleES) subtitleES.close();   // 避免重复连接
        subtitleES = new EventSource('/sse?sessionid=' + getSessionId());
        subtitleES.onmessage = function (ev) {
            var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
            if (!m) return;
            var el = document.getElementById('subtitle');
            // 新一轮回答开始 → 清空字幕；此后每句 start 逐句追加，累积成完整回答
            if (m.status === 'reply_start') {
                el.textContent = '';
            } else if (m.status === 'start' && m.text) {
                el.textContent += m.text;
                // 语音开始合成 → 结算本次响应耗时（仅在等待测量时结算一次）
                if (respStartT !== null) finishResponseMeasure();
            }
        };
        subtitleES.onerror = function () {};  // EventSource 自动重连，忽略
    }

    function stopSubtitle() {
        if (subtitleES) { subtitleES.close(); subtitleES = null; }
    }

    /* ==========================================================
     * 4. 摄像头「看用户」：按需抓帧喂给后端 look_at_user 工具
     *    隐私：点开开关才打开摄像头（静默开流、本地不显示画面）；
     *    后端要帧才通过 WS 发 capture_request，现场抓一帧 JPEG 回传即弃；
     *    关闭则停流 + 断开 WS。指示灯出现红色脉冲点 = 摄像头在开。
     * ========================================================== */
    var camOn = false;         // 摄像头开关
    var camStream = null;      // getUserMedia 媒体流
    var camVideo = null;       // 隐藏预览 video（仅用于抓帧）
    var camWS = null;          // /api/camera/ws
    var analyzingCam = false;  // 抓帧中，防并发

    function renderCam() {
        var b = document.getElementById('btn-camera');
        var l = document.getElementById('camera-label');
        if (l) l.textContent = camOn ? '摄像头 开' : '摄像头';
        if (b) b.classList.toggle('active', camOn);
    }

    function toggleCamera() {
        if (camOn) { stopCamera(); } else { startCamera(); }
    }

    function camWSLoop() {
        if (!camOn) return;
        var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        camWS = new WebSocket(wsProto + location.host + '/api/camera/ws?session=' + encodeURIComponent(getSessionId()));
        camWS.onmessage = function (ev) {
            var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
            if (m && m.type === 'capture_request' && !analyzingCam) captureAndSend();
        };
        camWS.onclose = function () { if (camOn) setTimeout(camWSLoop, 1500); };
        camWS.onerror = function () { try { camWS.close(); } catch (e) {} };
    }

    function captureAndSend() {
        if (!camVideo || camVideo.readyState < 2 || !camWS || camWS.readyState !== 1) return;
        analyzingCam = true;
        try {
            var w = camVideo.videoWidth || 480, h = camVideo.videoHeight || 270;
            var c = document.createElement('canvas');
            c.width = Math.min(w, 480);   // 降采样，别传高清原图
            c.height = Math.max(1, Math.round(h * (c.width / (w || 1))));
            c.getContext('2d').drawImage(camVideo, 0, 0, c.width, c.height);
            camWS.send(JSON.stringify({ type: 'snapshot', data: c.toDataURL('image/jpeg', 0.6) }));
        } catch (e) { }
        analyzingCam = false;
    }

    async function startCamera() {
        if (camOn) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            renderCam();
            alert('当前浏览器不支持摄像头');
            return;
        }
        try {
            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480 } });
        } catch (e) {
            renderCam();
            alert('摄像头授权失败或被拒绝：' + (e && e.name ? e.name : e));
            return;
        }
        camVideo = document.createElement('video');
        camVideo.muted = true; camVideo.playsInline = true;
        camVideo.srcObject = camStream;
        try { await camVideo.play(); } catch (e) { }
        camOn = true;
        renderCam();
        camWSLoop();
    }

    function stopCamera() {
        camOn = false;
        if (camWS) { try { camWS.close(); } catch (e) {} camWS = null; }
        if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
        camVideo = null;
        renderCam();
    }

    function bargeInEnabled() {
        var c = document.getElementById('barge-in');
        return !c || c.checked;      // 默认开启
    }

    function toggleVoice() {
        if (callOn) { stopCall(); } else { startCall(); }
    }

    async function startCall() {
        var Uri = document.getElementById('wssip').value;
        if (!Uri.match(/^wss?:\/\//)) {
            setCallStatus('请先在设置中填写正确的 asr 服务器地址', 'error');
            return;
        }
        if (!window.vad || !window.vad.MicVAD) {
            setCallStatus('语音检测库未加载', 'error');
            return;
        }
        callOn = true;
        renderCallBtn();
        setCallStatus('初始化语音检测...', 'busy');
        try {
            myvad = await window.vad.MicVAD.new({
                onnxWASMBasePath: "lib/",   // 本地 onnxruntime wasm
                baseAssetPath: "lib/",      // 本地 silero 模型 + worklet
                onSpeechStart: function () {
                    if (!callOn) return;
                    // 插话：数字人正在说话时用户开口 → 立即打断
                    if (bargeInEnabled() && avatarSpeaking && Date.now() > suppressUntil) {
                        interruptAvatar();
                        suppressUntil = Date.now() + suppressMs;
                        setCallStatus('已打断数字人...', 'interrupt');
                    }
                    if (!draining) setCallStatus('说话中...', 'speaking');
                },
                onSpeechRealStart: function () {
                    if (!draining) setCallStatus('收集中...', 'collecting');
                },
                onVADMisfire: function () {
                    if (!draining) setCallStatus('正在倾听...', 'listening');
                },
                onSpeechEnd: function (audio) {
                    if (!callOn) return;
                    startResponseMeasure();       // 检测到语音(结束) → 开始计时
                    utteranceQueue.push(audio);   // 入队，绝不丢弃
                    drainQueue();
                },
            });
            myvad.start();
            startPolling();
            setCallStatus('正在倾听，请说话...', 'listening');
        } catch (e) {
            console.error('MicVAD init failed:', e);
            setCallStatus('语音检测初始化失败（需 localhost/https + 麦克风）', 'error');
            callOn = false;
            renderCallBtn();
        }
    }

    // 立即打断数字人当前说话
    function interruptAvatar() {
        fetch('/interrupt_talk', {
            body: JSON.stringify({ sessionid: getSessionId() }),
            headers: { 'Content-Type': 'application/json' }, method: 'POST'
        }).catch(function (er) { console.error('interrupt error:', er); });
    }

    var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

    // 顺序处理识别队列：识别 → LLM 对话（interrupt:true 覆盖旧回复）
    async function drainQueue() {
        if (draining || !callOn) return;
        draining = true;
        while (utteranceQueue.length && callOn) {
            var audio = utteranceQueue.shift();
            setCallStatus('识别中...', 'recognizing');
            var r = await runTranscription(audio);
            if (!r.text) {
                setCallStatus('未识别到有效内容', 'warn');
                continue;
            }
            document.getElementById('msg').value = r.text;   // 输入框显示识别结果
            setCallStatus('识别 → 请稍候...', 'thinking');
            await sendChat(r.text, r.trace_id);
        }
        draining = false;
        if (callOn) setCallStatus('正在倾听...', 'listening');
    }

    // 刚上传的文件（相对路径）：随下一条 chat 消息带给后端，提示模型先 list_files 核实
    var _pendingUploadNote = null;

    function sendChat(text, trace_id) {
        var body = {
            text: text, type: 'chat', interrupt: true, sessionid: getSessionId()
        };
        // echo ASR 服务端下发的回合 trace_id，让聊天 trace 复用同一 id（拼成一条 trace）
        if (trace_id) body.trace_id = trace_id;
        // 上传提示仅随第一条消息送达一次，避免反复注入
        if (_pendingUploadNote) {
            body.upload_note = _pendingUploadNote;
            _pendingUploadNote = null;
        }
        return fetch('/human', {
            body: JSON.stringify(body),
            headers: { 'Content-Type': 'application/json' }, method: 'POST'
        }).catch(function (er) { console.error('ASR chat error:', er); });
    }

    /* ==========================================================
     * 文件上传（后端 POST /api/files/upload → data/uploads/<sessionid>/）
     * ========================================================== */
    var _toastEl = null;
    function showToast(msg, isErr) {
        if (!_toastEl) {
            _toastEl = document.createElement('div');
            _toastEl.style.cssText =
                'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;' +
                'max-width:76vw;padding:10px 16px;border-radius:8px;color:#fff;font-size:14px;' +
                'box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transition:opacity .25s;' +
                'background:' + (isErr ? 'rgba(211,47,47,.92)' : 'rgba(20,30,40,.92)');
            document.body.appendChild(_toastEl);
        }
        _toastEl.style.background = isErr ? 'rgba(211,47,47,.92)' : 'rgba(20,30,40,.92)';
        _toastEl.textContent = msg;
        _toastEl.style.opacity = '1';
        clearTimeout(_toastEl._t);
        _toastEl._t = setTimeout(function () { _toastEl.style.opacity = '0'; }, 5000);
    }

    function triggerUpload() {
        var fi = document.getElementById('file-input');
        fi.value = '';
        fi.click();
    }

    // 监听文件选择 → 立即 POST 到通用上传路由；成功后提示返回的相对路径
    document.addEventListener('change', function (evt) {
        var fi = document.getElementById('file-input');
        if (evt.target !== fi || !fi.files || !fi.files.length) return;
        var file = fi.files[0];
        var fd = new FormData();
        fd.append('sessionid', getSessionId());
        fd.append('file', file);
        showToast('正在上传 ' + file.name + ' …', false);
        fetch('/api/files/upload', { body: fd, method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (resp) {
                if (resp && resp.code === 0 && resp.data && resp.data.path) {
                    var path = resp.data.path;
                    // 记为「待携带的上传提示」，下一条 chat 消息送达后端（见 sendChat）
                    _pendingUploadNote = path;
                    showToast('已上传：' + path + '。可在对话里让我读取这个文件。', false);
                    // 顺带把相对路径填进输入框，方便直接用文字指代
                    var msg = document.getElementById('msg');
                    if (msg) { msg.value = path; msg.focus(); }
                } else {
                    showToast('上传失败：' + ((resp && resp.msg) || '未知错误'), true);
                }
            })
            .catch(function (er) {
                console.error('upload error:', er);
                showToast('上传失败（网络或服务错误）', true);
            });
    });

    // 读取设置中的热词，转成 FunASR 期望的 {"热词":权重} JSON 字符串。
    // 与 asr/index.html（webrtcapi-asr 内嵌的 ASR 演示页）保持一致：
    // 每行一个热词，空格隔开权重，如"阿里巴巴 20"。
    function getHotwords() {
        var obj = document.getElementById('hotwords');
        if (!obj || !obj.value || obj.value.length <= 0) return null;
        var items = obj.value.split(/[\r\n]+/);
        var jsonresult = {};
        var regexNum = /^[0-9]*$/;
        items.forEach(function (item) {
            var result = item.split(" ");
            if (result.length >= 2 && regexNum.test(result[result.length - 1])) {
                var wordstr = result.slice(0, -1).join(" ");
                jsonresult[wordstr.trim()] = parseInt(result[result.length - 1], 10);
            }
        });
        return JSON.stringify(jsonresult);
    }

    function runTranscription(float32) {
        return new Promise(function (resolve) {
            var Uri = document.getElementById('wssip').value;
            var s = null;
            try { s = new WebSocket(Uri); } catch (e) { resolve({ text: '', trace_id: null }); return; }
            var done = false;
            var timer = window.setTimeout(function () {
                if (!done) { done = true; try { s.close(); } catch (e) {} resolve({ text: '', trace_id: null }); }
            }, 30000);

            s.onopen = function () {
                var request = {
                    chunk_size: [5, 10, 5], wav_name: "h5", is_speaking: true,
                    chunk_interval: 10, itn: false, mode: "2pass"
                };
                var hotwords = getHotwords();
                if (hotwords) request.hotwords = hotwords;   // 热词：识别时优先命中
                s.send(JSON.stringify(request));
                var n = float32.length;
                var int16 = new Int16Array(n);
                for (var i = 0; i < n; i++) {
                    var v = Math.max(-1, Math.min(1, float32[i]));
                    int16[i] = (v < 0) ? (v * 0x8000) : (v * 0x7FFF);
                }
                var chunk = 960;
                for (var o = 0; o < n; o += chunk) {
                    var sl = int16.slice(o, Math.min(o + chunk, n)); // 拷贝，避免发整个 buffer
                    s.send(sl.buffer);
                }
                s.send(JSON.stringify({
                    chunk_size: [5, 10, 5], wav_name: "h5", is_speaking: false,
                    chunk_interval: 10, mode: "2pass"
                }));
            };
            s.onmessage = function (ev) {
                var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
                if (m && m.is_final && (m.mode === '2pass-offline' || m.mode === 'offline') && !done) {
                    done = true; clearTimeout(timer);
                    try { s.close(); } catch (e) {}
                    resolve({ text: m.text || '', trace_id: m.trace_id || null });
                }
            };
            s.onerror = function () {
                if (!done) { done = true; clearTimeout(timer); try { s.close(); } catch (e) {} resolve({ text: '', trace_id: null }); }
            };
            s.onclose = function () {
                if (!done) { done = true; clearTimeout(timer); resolve({ text: '', trace_id: null }); }
            };
        });
    }

    async function is_avatar_speaking() {
        var res = await fetch('/is_speaking', {
            body: JSON.stringify({ sessionid: getSessionId() }),
            headers: { 'Content-Type': 'application/json' }, method: 'POST'
        });
        var d = await res.json();
        return !!d.data;
    }

    // 轮询数字人说话状态，供插话与回声抑制使用
    function startPolling() {
        stopPolling();
        pollTimer = window.setInterval(function () {
            if (!callOn) return;
            is_avatar_speaking().then(function (sp) {
                var was = avatarSpeaking;
                avatarSpeaking = sp;
                // 数字人开口瞬间抑制自身首段回声
                if (sp && !was) suppressUntil = Date.now() + suppressMs;
            }).catch(function () {});
        }, 500);
    }
    function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function stopCall() {
        callOn = false;
        stopPolling();
        avatarSpeaking = false;
        utteranceQueue = [];
        draining = false;
        if (myvad) { try { myvad.destroy(); } catch (e) {} myvad = null; }
        renderCallBtn();
        setCallStatus('已关闭通话', 'off');
    }

    /* ==========================================================
     * 4. 全屏（浏览器原生切换）
     * ========================================================== */
    function toggleFullscreen() {
        var doc = document;
        var el = doc.documentElement;
        if (!doc.fullscreenElement && !doc.webkitFullscreenElement && !doc.mozFullScreenElement) {
            (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
        } else {
            (doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen).call(doc);
        }
    }

    /* ==========================================================
     * 5. 设置弹窗 + ASR 地址
     * ========================================================== */
    function openSettings() {
        document.getElementById('modal-mask').classList.add('open');
    }
    function closeSettings() {
        document.getElementById('modal-mask').classList.remove('open');
    }
    function sendEcho() {
        var t = document.getElementById('echo-text').value;
        if (t) { sendText(t); }
    }
    function addresschange() {
        var Uri = document.getElementById('wssip').value;
        var authUri = Uri.replace(/^wss/i, 'https');
        var link = document.getElementById('wsslink');
        link.href = authUri;
        link.setAttribute('data-auth', authUri);
    }
    function openAuth() {
        var auth = document.getElementById('wsslink').getAttribute('data-auth') ||
            document.getElementById('wssip').value.replace(/^wss/i, 'https');
        window.open(auth, '_blank');
        return false;
    }

    /* ==========================================================
     * 6. 初始化
     * ========================================================== */
    $(document).ready(function () {
        // 自动检测本地 ASR 端点（与 asr/main.js 一致）
        var protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        var host = window.location.host;
        document.getElementById('wssip').value = protocol + host + "/api/asr";
        document.getElementById('asr-hint').textContent = "已自动检测为本地端点: " + protocol + host + "/api/asr";
        addresschange();

        // 底栏输入框：回车发送文字，交给 LLM 对话回答（type: chat）
        $('#msg').on('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var t = $(this).val().trim();
                if (t) { startResponseMeasure(); sendChat(t); }
                $(this).val('');
            }
        });

        // 连接提前到页面加载：静音自动播放视频（浏览器策略允许无声自动播放），
        // 同时在画面上盖半透明遮罩提示点击；首次点击隐藏遮罩并开声。
        // 字幕流在连接建立后随之开启（见 startAvatars 内的 negotiate().then(startSubtitle)）。
        startAvatars();

        // 首次点击（/触摸/按键）：隐藏遮罩。开声由 startAvatars 内的
        // firstInteraction（首帧静音播放 + 点击后 tryUnmute）完成。
        function dismissMask() {
            var mask = document.getElementById('start-mask');
            if (mask) mask.style.display = 'none';
        }
        document.addEventListener('click', dismissMask, { once: true });
        document.addEventListener('touchstart', dismissMask, { once: true, passive: true });
        document.addEventListener('keydown', dismissMask, { once: true });
    });
</script>
</body>
