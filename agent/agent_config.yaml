# agent 对话/记忆配置
# 修改后重启服务生效。

system_prompt: "你是一个知识助手，尽量以简短、口语化的方式输出。只使用纯文本和正常的标点符号，不要使用任何表情符号/表情包、emoji、Markdown 记号（如 *、**、#、`、_）或其他特殊符号。用户的提问是通过语音识别（语音转写）输入的，技术名词、专有名词、人名、程序名、版本号、单词等容易因同音或近音被听错/写成错字。请结合上下文与常识判断用户实际想说的正确内容，并按其真实意图作答；直接回答，不要复读或引用原文里疑似听错的字，也不要反问'你是不是想说XX'。"

memory:
  enabled: true
  # 自上次压缩后再积累的轮次达到该值 → 触发对旧轮次的压缩（后台异步执行）
  compress_threshold: 10
  # 发往 LLM 的上下文里，保留的最近原始轮数（这一部分不参与摘要压缩）
  keep_recent: 5
  # 压缩摘要的目标长度（有界：summary 字段稳态尺寸约等于此值），单位：字
  target_summary_chars: 600
  # 压缩用的提示词（会被动态追加“控制在约 N 字内”）
  summarize_prompt: "请把以下对话历史压缩成一段简短的要点总结，保留关键信息；直接输出总结，不要加任何前缀或说明。"
  # 压缩使用的模型；留空(null)则复用 infra_ai 默认文本模型
  summarize_model: null

  # ── 跨会话长期记忆（persistent）：把会话里学到的持久知识落盘，下次新会话按需召回 ──
  longterm:
    enabled: true                    # 主开关；false 时召回返回空、提取跳过（零开销）
    dir: null                        # 记忆目录；null→data/memory，或 AGENT_MEMORY_DIR env
    store_types: [user, feedback, project, reference, state]   # 允许落盘的记忆类型
    recall_mode: auto                # auto→轻量即时注入；model→s09 模型选择（低延迟敏感部署用）
    recall_top_k: 3                  # 召回注入的最大记忆条数
    recall_char_limit: 800           # 注入正文总字符上限（有界）
    recall_score_backend: auto       # auto→rerank 首选、失败退关键词；keyword→纯关键词
    extract_model: null              # 提取用模型；留空(null)复用默认文本模型
    extract_trigger: every_turn      # every_turn | every_n_turns
    extract_every_n_turns: 0         # 0 = 每回合都后台提取（查重/准入后很便宜）
    consolidate_threshold: 10        # 记忆条数达到该值触发后台整理去重

tools:
  # 工具循环的防御性轮次上限（正常 1 轮即出口）
  max_rounds: 4
  web_search:
    enabled: true      # true→头像对话可联网搜索
    max_sources: 5     # 每次搜索最多返回几条结果
  weather:
    enabled: true      # true→天气问题用专用 Open-Meteo 实时接口（通用搜索查不准实时天气）
    forecast_base_url: "https://api.open-meteo.com"          # 如需代理可改
    geocoding_base_url: "https://geocoding-api.open-meteo.com"  # 如需代理可改
    # 常用城市已有内置坐标；额外的「城市名(中文): [纬度, 经度]」可在此补充/覆盖
    coords: {}
    # 例： { "拉萨": [29.652, 91.172] }（把需要补充/覆盖的城市按此格式填）
  reminder:
    enabled: true      # true→支持「X分钟后提醒我Y」/「每天上午9点提醒我Y」这类全局定时提醒
    store_path: "data/reminders.json"   # 持久化文件；留空用默认（相对项目根目录）
    max_delay_seconds: 604800           # 一次性延时上限：7 天（防误配超长延时）