# agent 对话/记忆配置
# 修改后重启服务生效。

system_prompt: "你是一个知识助手，尽量以简短、口语化的方式输出。只使用纯文本和正常的标点符号，不要使用任何表情符号/表情包、emoji、Markdown 记号（如 *、**、#、`、_）或其他特殊符号。用户的提问是通过语音识别（语音转写）输入的，技术名词、专有名词、人名、程序名、版本号、单词等容易因同音或近音被听错/写成错字。请结合上下文与常识判断用户实际想说的正确内容，并按其真实意图作答；直接回答，不要复读或引用原文里疑似听错的字，也不要反问'你是不是想说XX'。凡是涉及用户自身外貌、身份或当下状态的问题（性别、年龄、长相、发型打扮、佩戴什么、情绪如何等），应优先调用 look_at_user 工具获取实时画面后再作答；以实时画面为准，不要根据对话历史里已经叙述过的视觉细节来推断或『替你在看』。若画面拿不到，如实说明看不到，不要臆测或编造。此外，当用户表达要『查/看/调工具/看看有什么』这类请求，而回答取决于会话内部或外部的可查询状态（本会话有没有上传文件、文件内容、天气、时间、搜索结果等）时，应先把对应工具（list_files / read_file / web_search / weather / question_search 等）真正调用一遍，用工具返回的结果来作答；在真正拿到工具结果之前，不要断言『没有』『是空的』『我已经查过了』——拿不准就先查再答。"

memory:
  enabled: true
  # 自上次压缩后再积累的轮次达到该值 → 触发对旧轮次的压缩（后台异步执行）
  compress_threshold: 10
  # 发往 LLM 的上下文里，保留的最近原始轮数（这一部分不参与摘要压缩）
  keep_recent: 5
  # 压缩摘要的目标长度（有界：summary 字段稳态尺寸约等于此值），单位：字
  target_summary_chars: 600
  # 压缩用的提示词（会被动态追加“控制在约 N 字内”）
  summarize_prompt: "请把以下对话历史压缩成一段简短的要点总结，保留关键信息；直接输出总结，不要加任何前缀或说明。"
  # 压缩使用的模型；留空(null)则复用 infra_ai 默认文本模型
  summarize_model: null

  # ── 跨会话长期记忆（persistent）：把会话里学到的持久知识落盘，下次新会话按需召回 ──
  longterm:
    enabled: true                    # 主开关；false 时召回返回空、提取跳过（零开销）
    dir: null                        # 记忆目录；null→data/memory，或 AGENT_MEMORY_DIR env
    store_types: [user, feedback, project, reference, state]   # 允许落盘的记忆类型
    recall_mode: auto                # auto→轻量即时注入；model→s09 模型选择（低延迟敏感部署用）
    recall_top_k: 3                  # 召回注入的最大记忆条数
    recall_char_limit: 800           # 注入正文总字符上限（有界）
    recall_score_backend: auto       # auto→rerank 首选、失败退关键词；keyword→纯关键词
    extract_model: null              # 提取用模型；留空(null)复用默认文本模型
    extract_trigger: every_turn      # every_turn | every_n_turns
    extract_every_n_turns: 0         # 0 = 每回合都后台提取（查重/准入后很便宜）
    consolidate_threshold: 10        # 记忆条数达到该值触发后台整理去重
    consolidate_keep: 8              # 整理后条数硬上限（须 < threshold，保证收敛不再空转）
    consolidate_cooldown: 300        # 两次整理的最小间隔（秒），防阈值震荡频繁触发

tools:
  # 工具循环的防御性轮次上限（正常 1 轮即出口）
  max_rounds: 12
  web_search:
    enabled: true      # true→头像对话可联网搜索
    max_sources: 5     # 每次搜索最多返回几条结果
  weather:
    enabled: true      # true→天气问题用专用 Open-Meteo 实时接口（通用搜索查不准实时天气）
    forecast_base_url: "https://api.open-meteo.com"          # 如需代理可改
    geocoding_base_url: "https://geocoding-api.open-meteo.com"  # 如需代理可改
    # 常用城市已有内置坐标；额外的「城市名(中文): [纬度, 经度]」可在此补充/覆盖
    coords: {}
    # 例： { "拉萨": [29.652, 91.172] }（把需要补充/覆盖的城市按此格式填）
  reminder:
    enabled: true      # true→支持「X分钟后提醒我Y」/「每天上午9点提醒我Y」这类全局定时提醒
    store_path: "data/reminders.json"   # 持久化文件；留空用默认（相对项目根目录）
    max_delay_seconds: 604800           # 一次性延时上限：7 天（防误配超长延时）
  look_at_user:
    enabled: true      # true→数字人可用摄像头「看你一眼」（需浏览器开摄像头开关并授权）。
                       # 后端用配置的 VLM（LLM_ROUTING.vision）描述画面；无帧则如实说「看不到」。
                       # 隐私：按需抓一帧即弃，不进对话历史、不落盘。
  # 通用文件工具（插口④；非能力，与 web_search/weather 平级）——会话范围内读写上传文件
  files:
    enabled: true      # true→会话内 list_files / read_file 可用（简历/JD 等上传文件）
    upload_dir: null   # 上传根目录；null→data/uploads（会话共享暂存区）

  # 面试题库向量检索（通用只读工具；语义召回本地 chromadb 题库，任意会话常驻可用）
  question_search:
    enabled: true      # true→模型可用 question_search 查本地面试题库
    top_k: 8           # 默认检索返回条数
  # 系统关机（破坏性动作，默认关闭；需要时改为 true 后重启生效）
  shutdown_pc:
    enabled: true      # true→模型在用户明确表达关机意图时调用 shutdown_pc 关机
    delay_max_seconds: 3600   # 延迟关机缓冲上限（秒）
  # 本地音乐播放（默认关闭；需要时改为 true 后重启生效）
  play_music:
    enabled: true      # true→模型在用户表达听歌/背景音乐时调用 play_music 播放本地音乐
    dir: null          # 音乐目录；null→data/music（放 .mp3/.wav/.flac/.m4a/.ogg 等）
    volume: 80         # 默认音量 0-100
    device: null       # pyaudio 输出设备索引；null→系统默认声卡
    duck: true         # 数字人说话时自动压低音量（音量闪避，降低外放串麦干扰 ASR）
    duck_gain: 0.25    # 闪避时压到的比例 0.05-1.0

  # MCP（Model Context Protocol）外部工具接入（默认关闭；需要时改为 true 后重启生效）
  # 连接多台 MCP 服务器，把其工具以 mcp_<server>_<tool> 注册进工具表。
  # 传输：stdio（本地子进程，离线可用）| sse | http（远程，需网络可达）。
  # 例：filesystem / sqlite / git 等 npx 生态 MCP，或自建远程服务器。
  mcp:
    enabled: true              # true→启动时连接下述各服务器并注册工具
    connect_timeout: 60        # 每台服务器建连+注册的超时上限（秒）；npx 首次拉包可能偏慢
    servers:
      # 网易云/腾讯/酷狗/酷我 音乐查询 MCP（@eldment/meting-agent，stdio，node/npx 需在 PATH）
      # 提供 platforms / search / song / album / artist / playlist / url / lyric / pic，
      # 工具名以 mcp_meting_<tool> 进入工具表。
      # 未登录也能用，但部分平台高清/完整直达链接需 Cookie；按平台填 METING_<PLATFORM>_COOKIE，
      # 或用 METING_COOKIE 统一兜底（优先级见该包 README）。
      meting:
        transport: stdio
        command: npx
        args: ["-y", "@eldment/meting-agent@latest"]
        env: {}
      # 本地 stdio 示例：npx 起的 filesystem 服务器（把目录换成实际路径）
      # fs:
      #   transport: stdio
      #   command: npx
      #   args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/data"]
      #   env: {}
      # 远程 http 示例（需网络可达；headers 会被烤进 http 客户端）
      # remote_http:
      #   transport: http
      #   url: "https://example.com/mcp"
      #   headers: {}
      # 远程 sse 示例
      # remote_sse:
      #   transport: sse
      #   url: "https://example.com/sse"
      #   headers: {}

# ── 可插拔能力（下述默认值来自各能力 config_defaults()，此处可覆盖）──
capabilities:
  interview:
    enabled: true              # 模拟面试能力（模型驱动、state 制导、按态暴露工具）
    default_role: "前端"        # 缺省岗位方向
    default_level: "初级"       # 缺省难度
    max_questions: 5
    idle_timeout_s: 1800
    remember_policy: identity_only   # identity_only | full | none
    bank_csv: null                    # 题库目录 CSV；null→data/question_bank.csv
    essay_csv: null                   # 题目 CSV；null→data/question_essay.csv
    index_dir: "data/capabilities/interview/chroma"  # chromadb 落盘目录
    recall_top_k: 8
    # 环节序列（可配，整体替换这份列表；缺省用能力默认 自介→项目→八股→反问）。
    # type ∈ self_intro / project / trivia / reverse_qa；
    # 对话段（self_intro / reverse_qa）不设 count，离散段 count 缺省取 max_questions。
    # sections:
    #   - { type: self_intro, name: 开场自我介绍 }
    #   - { type: trivia,     name: 基础八股,   count: 5 }
    #   - { type: project,    name: 项目深挖,   count: 2 }
    #   - { type: reverse_qa, name: 反向提问 }