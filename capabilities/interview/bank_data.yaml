# 模拟面试内置题库（可被 data/interview_bank.yaml 覆盖）
# 字段：role/level/category/type/tags/rubrics，专为召回设计
bank:
  - id: fe-closure
    role: ["前端"]        level: ["初级", "中级"]
    category: JavaScript  type: technical
    text: "解释一下闭包"
    tags: ["作用域", "内存"]
    rubrics: {理解: "词法作用域/闭包能共享外部变量", 表达: "分层讲清楚定义与成因", 逻辑: "能说明典型用途与陷阱", 完整: "覆盖变量声明提前/循环闭包"}
    followups: ["闭包会造成内存泄漏吗？怎么避免"]
  - id: fe-eventloop
    role: ["前端"]        level: ["初级", "中级"]
    category: JavaScript  type: technical
    text: "说说事件循环（Event Loop）机制"
    tags: ["异步", "宏任务"]
    rubrics: {理解: "调用栈/任务队列/微任务与宏任务", 表达: "用例子说明执行顺序", 逻辑: "能解释 async/await 与 setTimeout 交互", 完整: "覆盖 IO 观察者等细节"}
    followups: ["微任务和宏任务谁先执行？为什么"]
  - id: fe-virtualdom
    role: ["前端"]        level: ["中级", "高级"]
    category: 框架      type: technical
    text: "讲讲 Virtual DOM 的作用与 diff 原理"
    tags: ["React", "性能"]
    rubrics: {理解: "为何需要 virtual dom / 开销在哪", 表达: "讲清 diff 的核心假设", 逻辑: "能说 key 的作用与列表 diff", 完整: "覆盖 fiber 调度或时间切片"}
    followups: ["为什么不直接用真实 DOM 上的 diff"]
  - id: fe-csscontain
    role: ["前端"]        level: ["初级"]
    category: CSS       type: technical
    text: "CSS 的盒模型有哪些？box-sizing 怎么影响布局"
    tags: ["布局", "兼容"]
    rubrics: {理解: "标准盒与怪异盒差异", 表达: "举例说明 content-box/border-box", 逻辑: "能说明何时用哪种", 完整: "覆盖边距折叠或子元素溢出"}
    followups: []
  - id: fe-rerender
    role: ["前端"]        level: ["中级", "高级"]
    category: 框架      type: technical
    text: "React 里组件为什么会重复渲染？如何避免无效渲染"
    tags: ["性能", "状态"]
    rubrics: {理解: "state/props/context 触发重渲染的条件", 表达: "讲清 useState 更新后的流程", 逻辑: "能说出 memo/useCallback 的适用边界", 完整: "覆盖 key 变化或父组件重渲染"}
    followups: ["不写 memo 一定多渲染吗？什么时候才值得"]
  - id: fe-cache
    role: ["前端"]        level: ["中级", "高级"]
    category: 浏览器属性  type: technical
    text: "浏览器的强缓存与协商缓存是怎么配合工作的"
    tags: ["性能", "网络"]
    rubrics: {理解: "Cache-Control/Expires 与 Etag/Last-Modified", 表达: "讲清两级缓存的触发顺序", 逻辑: "能说明到跳转/刷新的差异", 完整: "覆盖启发式缓存"}
    followups: ["强制刷新为什么能拿到新资源"]
  - id: fe-state-mgmt
    role: ["前端"]        level: ["中级", "高级"]
    category: 框架      type: behavioral
    text: "项目里做复杂状态管理时，你一般怎么选方案、踩过什么坑"
    tags: ["架构", "Redux"]
    rubrics: {理解: "知道集中式 vs 原子式状态管理的权衡", 表达: "结合自己项目讲", 逻辑: "能给出取舍理由", 完整: "覆盖可维护性/团队协作"}
    followups: ["如果团队一开始就用了不适合的方案，你该怎么处理"]
  - id: fe-project
    role: ["前端"]        level: ["初级", "中级"]
    category: 综合      type: behavioral
    text: "介绍一个你最近做过的前端项目，聊聊你在里面的角色与难点"
    tags: ["工程化", "表达"]
    rubrics: {理解: "讲清项目背景与目标", 表达: "结构清晰、有亮点", 逻辑: "难点如何定位与解决", 完整: "总结沉淀与改进"}
    followups: ["如果重做一遍你会改哪里"]

  - id: be-restful
    role: ["后端"]        level: ["初级", "中级"]
    category: HTTP      type: technical
    text: "RESTful 接口设计里，URL 与状态码该怎么用合理"
    tags: ["规范", "语义"]
    rubrics: {理解: "资源化的 URL 与恰当状态码", 表达: "举例说明 GET/POST/PUT/DELETE", 逻辑: "能说明幂等与子资源", 完整: "覆盖 200/201/204/404/409"}
    followups: ["REST 与 RPC 各适合什么场景"]
  - id: be-db-index
    role: ["后端"]        level: ["中级", "高级"]
    category: 数据库      type: technical
    text: "数据库索引是怎么加速查询的？有什么代价"
    tags: ["索引", "性能"]
    rubrics: {理解: "B+ 树/索引查找原理", 表达: "讲清覆盖索引与回表", 逻辑: "能说明最左前缀与失效条件", 完整: "覆盖写放大与维护成本"}
    followups: ["为什么不能所有列都加索引"]
  - id: be-cache-consistent
    role: ["后端"]        level: ["中级", "高级"]
    category: 缓存      type: technical
    text: "缓存与数据库的一致性怎么保证？先删缓存还是先更新库"
    tags: ["一致性", "分布式"]
    rubrics: {理解: "缓存穿透/击穿/雪崩", 表达: "讲清双写一致性问题", 逻辑: "能说明删除 vs 更新的权衡", 完整: "覆盖延迟双删/消息异步"}
    followups: ["最终一致 vs 强一致各怎么取舍"]
  - id: be-thread
    role: ["后端"]        level: ["初级", "中级"]
    category: 并发      type: technical
    text: "线程池的参数怎么定？任务多了队列满了怎么办"
    tags: ["并发", "资源"]
    rubrics: {理解: "核心线程/队列/最大线程/拒绝策略", 表达: "举例说明", 逻辑: "能按 CPU/IO 型任务推断", 完整: "覆盖默认拒绝策略"}
    followups: []

  - id: g-behavioral
    role: ["*"]          level: ["初级", "中级", "高级"]
    category: 软技能      type: behavioral
    text: "讲一件你坚持原则或说'不'的经历"
    tags: ["价值观", "沟通"]
    rubrics: {理解: "说清当时的情境", 表达: "有始有终地讲", 逻辑: "矛盾点时如何权衡", 完整: "结尾有反思"}
    followups: []
  - id: g-situation
    role: ["*"]          level: ["中级", "高级"]
    category: 软技能      type: situational
    text: "如果项目上线前突然发现一个影响主流程的 bug，你会怎么处理"
    tags: ["应变", "优先级"]
    rubrics: {理解: "识别版查/回滚/通知的分层", 表达: "步骤清晰", 逻辑: "能权衡停线与止损", 完整: "事后复盘"}
    followups: ["线上 vs 测试环境的处理有什么不同"]
  - id: g-stress
    role: ["*"]          level: ["中级", "高级"]
    category: 软技能      type: behavioral
    text: "你经历过压力最大的一段工作或学习是什么？怎么扛过来的"
    tags: ["抗压", "自驱"]
    rubrics: {理解: "剖析压力来源", 表达: "讲清应对行动", 逻辑: "能区分情绪与事实", 完整: "给出自我调节方法论"}
    followups: []