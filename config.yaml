###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- 表情动作（说话时按情绪切基地帧）-----------------------------------------
# 开启后：每轮回答经 LLM 探测 emotion，说话时把「基地序列」切成对应表情底座视频
# （换一套底座帧，口型照常贴脸；不再是 customopt 那种与说话互斥的抢插）。
# 底座数据：先跑 `python scripts/prep_emotions.py`，用 sample_videos 生成
# data/actions/<emotion>/ 。neutral = 默认形象本来的底座，无需单独提供。
emotion:
  enabled: true                # true=开；false=完全关闭，行为回退到旧有说话
  names: [sad]                            # 候选表情；LLM 只会输出这些之一或 neutral（只有 sad 有底座）
  sample_videos:               # 首次用样例视频自动生成底座序列（可选；供 prep 脚本用）
                               # 只保留实际要用的表情；其他已删掉的不在此列
    sad: "D:\\Download\\browserDownload\\海螺_视频_做出委屈的表情，不说_550856995680083969 (1).mp4"

# -------- TTS ----------------------------------------------------------
tts: doubao                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: ''   # 音色槽置空 → 各引擎用自身缺省；如需按引擎指定音色，在 tts/config.yaml routing 候选 params 里配
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash
SPEECH_RATE: '+20%'            # 语速(edgetts 用，如 +20% 更快 / -15% 更慢；空=引擎默认；可被请求级 tts.rate 覆盖)
# ---- 豆包语气调整机制(可选；缺省=引擎默认；可被请求级 datainfo['tts'] 覆盖) ----
doubao_tone:
  llm_tone: true               # LLM 自动驱动语气：每轮对话开始前置一次廉价探测，LLM 按情绪给语气指令；
                               # true=开启(每轮多一次小 LLM 调用、略增首包时延)，false=关闭。仅 seed-tts-2.0 音色
  context_texts: []            # 全局语气指令，如 ["用温柔平和的语气"]；llm_tone=true 时会当兜底；仅 seed-tts-2.0 音色
  speech_rate: 0               # 语速 [-50,100]，0=默认，100=2倍速
  loudness_rate: 0             # 音量 [-50,100]，0=默认，100=2倍音量
  pitch: 0                     # 音调 [-12,12]，>0 更明亮 <0 更低沉
  explicit_dialect: ''         # 方言 beijing/sichuan/yue...（需音色支持）
  explicit_language: ''        # 语种 zh-cn/en/ko...（启用后只朗读该语种）
  section_id: ''               # 多轮关联 id；留空=每会话自动生成一个(语气会话内连续)
# ---- TTS 兜底加固(可选，去掉注释即可生效；缺省行为不变) ----
# TTSP_RETRY: 1                # 合成失败/音频被截断时的额外重试次数（0=不重试）
# TTSP_TIMEOUT: 30             # 单次合成超时(秒)，0=不设超时
# TTSP_MIN_AUDIO_MS: 300       # 合成音频低于此时长(毫秒)视为被截断并触发重试

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
